<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home — DBI Assess</title>
  <meta name="theme-color" content="#03c14b">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .hello { background: linear-gradient(120deg, var(--green), var(--blue)); color: #fff; border: 0; }
    .hello p { color: rgba(255,255,255,.9); margin: 0; }
    .test-card .btn { width: 100%; }
    @media (min-width: 640px) { .test-card .btn { width: auto; } }
  </style>
</head>
<body>
  <main class="page" id="main">
    <div class="card hello" style="margin-bottom:16px"><h1 id="hi">Welcome!</h1><p id="sub">Here is what is waiting for you.</p></div>
    <div id="banners"></div>
    <div class="grid cols-4" id="stats" style="margin-bottom:18px"></div>
    <div class="page-head"><h2 style="margin:0">Your tests</h2><a href="assessments.html" class="small">See all</a></div>
    <div class="grid cols-2" id="tests"><div class="card skeleton" style="height:150px"></div><div class="card skeleton" style="height:150px"></div></div>
    <div class="page-head" style="margin-top:22px"><h2 style="margin:0">Recent results</h2><a href="results.html" class="small">See all</a></div>
    <div id="recent"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/student.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireStudent();
      DBI.studentShell('dashboard', me);
      var esc = DBI.esc, icon = DBI.icon;
      var h = new Date().getHours();
      document.getElementById('hi').textContent = (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ', ' + (me.name.split(' ')[0] || 'friend') + ' 👋';

      var banners = document.getElementById('banners');
      var pending = await DBI.uploadPendingExams(me.user.uid);
      var html = '';
      if (pending.uploaded) html += '<div class="alert ok" style="margin-bottom:12px">' + icon('check') + '<span>' + pending.uploaded + ' test' + (pending.uploaded > 1 ? 's' : '') + ' finished offline ' + (pending.uploaded > 1 ? 'were' : 'was') + ' uploaded.</span></div>';
      if (pending.waiting) html += '<div class="alert warn" style="margin-bottom:12px">' + icon('cloud') + '<span>' + pending.waiting + ' finished test' + (pending.waiting > 1 ? 's are' : ' is') + ' saved on this device and will upload when you are online. Don’t clear your browser data.</span></div>';
      pending.inProgress.forEach(function (p) {
        html += '<div class="alert" style="margin-bottom:12px">' + icon('play') + '<span><b>' + esc(p.title) + '</b> is in progress on this device. <a href="take-assessment.html?id=' + encodeURIComponent(p.assessmentId) + '">Continue</a></span></div>';
      });
      banners.innerHTML = html;

      try {
        var data = await DBIStudent.loadOverview(me);
        var items = DBIStudent.classify(data, me);
        if (data.stale) banners.insertAdjacentHTML('beforeend', '<div class="alert warn" style="margin-bottom:12px">' + icon('wifiOff') + '<span>You are offline. Showing what was saved on ' + esc(DBI.fmtDate(data.at, true)) + '.</span></div>');
        var released = data.attempts.filter(function (t) { return t.released && typeof t.score === 'number'; });
        var avg = released.length ? Math.round(released.reduce(function (s, t) { return s + t.score; }, 0) / released.length) : null;
        var openCount = items.filter(function (i) { return ['open', 'retake', 'in-progress'].indexOf(i.state) !== -1; }).length;
        document.getElementById('stats').innerHTML = [
          ['list', openCount, 'Tests to do', ''],
          ['check', data.attempts.filter(function (t) { return t.status === 'submitted'; }).length, 'Tests finished', 'blue'],
          ['chart', avg === null ? '—' : avg + '%', 'Average score', ''],
          ['award', data.certificates, 'Certificates', 'blue'],
        ].map(function (s) { return '<div class="card stat"><span class="ico ' + s[3] + '">' + icon(s[0]) + '</span><div><b>' + esc(s[1]) + '</b><small>' + s[2] + '</small></div></div>'; }).join('');
        document.getElementById('sub').textContent = openCount ? 'You have ' + openCount + ' test' + (openCount > 1 ? 's' : '') + ' to do.' : 'You are all caught up. Great work!';

        var todo = items.filter(function (i) { return ['in-progress', 'open', 'retake', 'upcoming'].indexOf(i.state) !== -1; }).slice(0, 4);
        document.getElementById('tests').innerHTML = todo.length ? todo.map(DBIStudent.testCard).join('') : '<div class="card empty" style="grid-column:1/-1">' + icon('check') + '<p>No tests waiting right now.</p></div>';

        var recent = data.attempts.filter(function (t) { return t.status === 'submitted'; }).slice(0, 5);
        document.getElementById('recent').innerHTML = recent.length
          ? '<div class="table-wrap"><table class="table"><thead><tr><th>Test</th><th>Date</th><th>Result</th></tr></thead><tbody>' + recent.map(function (t) {
              var res = t.released && typeof t.score === 'number' ? '<b>' + t.score + '%</b> ' + (t.passed ? '<span class="badge green">Passed</span>' : '<span class="badge red">Not yet</span>') : '<span class="badge amber">Awaiting result</span>';
              return '<tr><td><a href="result-detail.html?id=' + encodeURIComponent(t.id) + '">' + esc(t.assessmentTitle) + '</a></td><td class="muted">' + esc(DBI.fmtDate(t.submittedAt)) + '</td><td>' + res + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : '<div class="card empty">' + icon('chart') + '<p>Your results will appear here.</p></div>';
      } catch (e) {
        document.getElementById('tests').innerHTML = '<div class="card empty" style="grid-column:1/-1">' + icon('wifiOff') + '<p>' + esc(e.message) + '</p></div>';
      }
    })();
  </script>
</body>
</html>
