<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My results — DBI Assess</title>
  <meta name="theme-color" content="#03c14b">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .res { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .res .pct { width: 58px; height: 58px; flex-shrink: 0; border-radius: 16px; display: grid; place-items: center; font-weight: 800; background: #f2f4f7; }
    .res .pct.pass { background: var(--green-50); color: var(--green-700); }
    .res .pct.fail { background: var(--red-50); color: var(--red); }
    .res .info { flex: 1; min-width: 0; }
    .res h3 { margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>My results</h1><p>Tap a result to see your answers when your teacher releases them.</p></div></div>
    <div id="list"><div class="card skeleton" style="height:84px"></div></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/student.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireStudent();
      DBI.studentShell('results', me);
      var esc = DBI.esc, icon = DBI.icon;
      await DBI.uploadPendingExams(me.user.uid);
      try {
        var data = await DBIStudent.loadOverview(me);
        var rows = data.attempts.filter(function (t) { return t.status === 'submitted'; });
        document.getElementById('list').innerHTML = (data.stale ? '<div class="alert warn" style="margin-bottom:12px">' + icon('wifiOff') + '<span>Offline — saved copy.</span></div>' : '') +
          (rows.length ? rows.map(function (t) {
            var hasScore = t.released && typeof t.score === 'number';
            var status = !t.released ? (t.gradingStatus === 'pending-review' ? '<span class="badge amber">Being marked</span>' : '<span class="badge amber">Result not released yet</span>') : hasScore ? (t.passed ? '<span class="badge green">Passed</span>' : '<span class="badge red">Not passed</span>') : '<span class="badge">Released</span>';
            return '<a class="card res" href="result-detail.html?id=' + encodeURIComponent(t.id) + '"><span class="pct ' + (hasScore ? (t.passed ? 'pass' : 'fail') : '') + '">' + (hasScore ? t.score + '%' : icon('clock')) + '</span>' +
              '<span class="info"><h3>' + esc(t.assessmentTitle) + '</h3><span class="row small muted"><span>Attempt ' + esc(t.attemptNumber || 1) + '</span><span>' + esc(DBI.fmtDate(t.submittedAt, true)) + '</span>' + status + (t.lateSync ? '<span class="badge">Uploaded late (offline)</span>' : '') + (t.legacy ? '<span class="badge">Old system</span>' : '') + '</span></span>' + icon('right') + '</a>';
          }).join('') : '<div class="card empty">' + icon('chart') + '<p>No results yet. <a href="assessments.html">Take a test</a></p></div>');
      } catch (e) {
        document.getElementById('list').innerHTML = '<div class="card empty">' + icon('wifiOff') + '<p>' + esc(e.message) + '</p></div>';
      }
    })();
  </script>
</body>
</html>
