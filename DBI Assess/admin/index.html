<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff sign in — DBI Assess</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <main class="auth-page">
    <div>
      <div class="auth-card">
        <div class="logo"><img src="../images/DBI-Official-Logo.png" alt="Digital Bridge Initiative" style="max-width:220px;height:auto"><h1 style="margin-top:12px">Staff sign in</h1><p class="muted">DBI Assess administration</p></div>
        <div id="msg" role="alert"></div>
        <form id="form" method="post" action="javascript:void(0)" onsubmit="return false" novalidate>
          <label class="field"><span>Email</span><input class="input" id="email" type="email" autocomplete="username" required></label>
          <label class="field"><span>Password</span><input class="input" id="pw" type="password" autocomplete="current-password" required></label>
          <button class="btn primary block" id="go" type="submit">Sign in</button>
        </form>
        <p style="text-align:center;margin-top:14px" class="small"><a href="#" id="forgot">Forgot password?</a> · <a href="../index.html">Student sign in</a></p>
      </div>
      <p class="credit">Built by <b>ProfJero Digital Studio</b> · Powered by <b>Digital Bridge Initiative</b></p>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script>
    (async function () {
      var msg = document.getElementById('msg');
      var go = document.getElementById('go');
      var next = new URLSearchParams(location.search).get('next');
      var target = next && /^\/[^/]/.test(next) && /\/admin\/|\/account\.html/.test(next) ? next : 'dashboard.html';
      function show(text, kind) {
        msg.innerHTML = text ? '<div class="alert ' + (kind || 'error') + '" style="margin-bottom:14px"><span>' + DBI.esc(text) + '</span></div>' : '';
      }
      async function isAdmin(user) {
        var snap = await DBI.db.collection('admins').doc(user.uid).get();
        return snap.exists;
      }
      document.getElementById('form').addEventListener('submit', async function () {
        show('');
        var email = document.getElementById('email').value.trim();
        var pw = document.getElementById('pw').value;
        if (!email || !pw) return show('Enter your email and password.');
        DBI.busy(go, true, 'Signing in…');
        try {
          await DBI.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
          var cred = await DBI.auth.signInWithEmailAndPassword(email, pw);
          if (!(await isAdmin(cred.user))) {
            await DBI.auth.signOut();
            throw new Error('This account is not a DBI Assess administrator.');
          }
          location.replace(target);
        } catch (e) {
          var code = e.code || '';
          show(/wrong-password|user-not-found|invalid-credential|invalid-login/.test(code) ? 'Email or password is incorrect.' : /too-many-requests/.test(code) ? 'Too many attempts. Wait a few minutes or reset your password.' : e.message);
          DBI.busy(go, false);
        }
      });
      document.getElementById('forgot').onclick = async function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        if (!email) return show('Type your email above first, then tap "Forgot password?".', 'warn');
        try {
          await DBI.auth.sendPasswordResetEmail(email);
          show('If that email belongs to an admin, a reset link is on its way.', 'ok');
        } catch (err) {
          show(err.message);
        }
      };
      var user = await DBI.currentUser();
      if (user && !user.isAnonymous && user.email && (await isAdmin(user).catch(function () { return false; }))) location.replace(target);
    })();
  </script>
</body>
</html>
