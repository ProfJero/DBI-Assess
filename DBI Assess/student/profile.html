<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>My Profile - DBI Assess</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/student.css">
    
    <style>
        /* Profile page specific styles */
        .profile-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 28px;
            margin-top: 8px;
        }
        
        .profile-sidebar {
            background: white;
            border-radius: 16px;
            padding: 28px 20px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #166534, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: white;
            margin: 0 auto 16px;
            border: 4px solid #dcfce7;
        }
        
        .profile-name-large {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }
        
        .profile-id-large {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
        }
        
        .profile-role-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .profile-divider {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 20px 0;
        }
        
        .profile-stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .profile-stat-item:last-child {
            border-bottom: none;
        }
        
        .profile-stat-label {
            color: #6b7280;
            font-size: 14px;
        }
        
        .profile-stat-value {
            font-weight: 600;
            color: #111827;
            font-size: 14px;
        }
        
        .profile-main {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            border: 1px solid #e5e7eb;
        }
        
        .profile-card-title {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .profile-card-title i {
            color: #166534;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        
        .form-group .form-value {
            background: #f9fafb;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            color: #111827;
            font-size: 14px;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        
        .form-group .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        
        .form-group .form-input:focus {
            outline: none;
            border-color: #166534;
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.1);
        }
        
        .form-group .form-input:disabled {
            background: #f9fafb;
            cursor: not-allowed;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        .btn-edit {
            background: #166534;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-edit:hover {
            background: #14532d;
        }
        
        .btn-save {
            background: #16a34a;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-save:hover {
            background: #15803d;
        }
        
        .btn-cancel {
            background: #f3f4f6;
            color: #374151;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-cancel:hover {
            background: #e5e7eb;
        }
        
        .profile-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-danger:hover {
            background: #b91c1c;
        }
        
        @media (max-width: 768px) {
            .profile-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .profile-card {
                padding: 18px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div>
                <div class="brand-text">DBI <span>Assess</span></div>
                <div class="brand-sub">Student Portal</div>
            </div>
        </div>

        <nav class="sidebar-menu">
            <div class="menu-label">Main</div>
            <a href="dashboard.html" class="menu-item">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="assessments.html" class="menu-item">
                <i class="fas fa-file-alt"></i> My Assessments
                <span class="badge green" id="assessmentCount">0</span>
            </a>
            <a href="results.html" class="menu-item">
                <i class="fas fa-chart-bar"></i> My Results
            </a>
            <a href="student-certificates.html" class="menu-item active">
                <i class="fas fa-certificate"></i> My Certificates
                <span class="badge green" id="certificateCount">0</span>
            </a>

            <div class="menu-label">Account</div>
            <a href="profile.html" class="menu-item active">
                <i class="fas fa-user"></i> Profile
            </a>
            <a href="#" class="menu-item" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </nav>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="hamburger" id="hamburgerBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h1>My Profile</h1>
                    <p>View and manage your profile information</p>
                </div>
            </div>
            <div class="header-right">
                <button class="notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="dot"></span>
                </button>
                <div class="student-profile">
                    <div class="avatar" id="studentAvatar">S</div>
                    <div class="student-info">
                        <div class="name" id="studentName">Student</div>
                        <div class="id" id="studentId">DBI-26-001</div>
                    </div>
                    <i class="fas fa-chevron-down chevron"></i>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area" id="pageContent">
            <!-- Profile will be rendered here by JavaScript -->
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- ============================================================
    JAVASCRIPT - Page logic
    ============================================================ -->
    <script src="js/profile.js"></script>
    
    <script>
        // ============================================================
        // FIREBASE CONFIGURATION
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyCdrmMMmZ0xdC2A_GXdAcWnUAa1i6QbjwQ",
            authDomain: "dbi-assess.firebaseapp.com",
            projectId: "dbi-assess",
            storageBucket: "dbi-assess.firebasestorage.app",
            messagingSenderId: "558455201415",
            appId: "1:558455201415:web:4a12a7b7c4cff9ecb6a222",
            measurementId: "G-FE2BPSJ4C5"
        };

        let db = null;
        let currentUser = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log('✅ Firebase initialized successfully');
        } catch (error) {
            console.error('❌ Firebase initialization error:', error);
        }

        // ============================================================
        // AUTHENTICATION CHECK
        // ============================================================

        function checkAuth() {
            const userData = sessionStorage.getItem('dbi_assess_user');
            
            if (userData) {
                try {
                    currentUser = JSON.parse(userData);
                    console.log('👤 Student logged in:', currentUser.studentId);
                    updateStudentUI();
                    
                    // Initialize the Profile module
                    const app = {
                        db: db,
                        currentUser: currentUser,
                        escapeHtml: escapeHtml,
                        formatDate: formatDate,
                        showToast: showToast
                    };
                    
                    const container = document.getElementById('pageContent');
                    Profile.render(container, app);
                    return;
                } catch (e) {
                    console.warn('Invalid session data:', e);
                }
            }

            console.log('🔐 No student logged in, redirecting...');
            window.location.href = '../index.html';
        }

        function updateStudentUI() {
            if (!currentUser) return;
            
            const name = currentUser.firstName || 'Student';
            document.getElementById('studentAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('studentName').textContent = name;
            document.getElementById('studentId').textContent = currentUser.studentId || 'N/A';
        }

        // ============================================================
        // HELPER FUNCTIONS
        // ============================================================

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(date) {
            if (!date) return 'N/A';
            try {
                if (date.toDate) {
                    return date.toDate().toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
                return new Date(date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch {
                return 'N/A';
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.className = 'toast';
            if (isError) {
                toast.classList.add('error');
                toast.querySelector('i').className = 'fas fa-exclamation-circle';
            } else {
                toast.classList.add('success');
                toast.querySelector('i').className = 'fas fa-check-circle';
            }
            toast.classList.add('show');
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('dbi_assess_user');
                window.location.href = '../index.html';
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();

            document.getElementById('hamburgerBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebarOverlay').classList.toggle('show');
            });

            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('show');
                }
            });
        });

        console.log('%c🎓 DBI Assess Student Portal', 'font-size: 20px; font-weight: bold; color: #166534;');
        console.log('%c👤 My Profile', 'font-size: 14px; color: #22c55e;');
        console.log('%c📋 View and manage your profile', 'font-size: 14px; color: #6b7280;');
    </script>

</body>
</html>
