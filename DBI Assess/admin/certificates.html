<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificates — DBI Assess Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>Certificates</h1><p id="sub">Certificates are created automatically when a student passes. You can also issue one by hand.</p></div><button class="btn primary" id="issueBtn"></button></div>
    <div class="toolbar"><input class="input" id="q" type="search" placeholder="Search name, Student ID or certificate number"><select class="input" id="sf" style="max-width:200px"><option value="">All</option><option value="pending">Waiting for approval</option><option value="issued">Issued</option><option value="revoked">Revoked</option></select><button class="btn ghost sm" id="csvBtn"></button></div>
    <div id="list"><div class="card skeleton" style="height:160px"></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/admin.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireAdmin();
      DBI.adminShell('certificates', me);
      var esc = DBI.esc, icon = DBI.icon, FV = firebase.firestore.FieldValue;
      var DEPARTMENTS = ['Digital Skills', 'Software Development', 'Graphics & Multimedia', 'Data Analysis', 'Digital Marketing', 'Cybersecurity', 'Network & Cloud', 'General'];
      var certs = [];
      document.getElementById('issueBtn').innerHTML = icon('award') + 'Issue certificate';
      document.getElementById('csvBtn').innerHTML = icon('download') + 'Export';

      function nameOf(c) { return ((c.studentFirstName || '') + ' ' + (c.studentLastName || '')).trim() || c.studentId || '—'; }
      function serialOf(c) { return c.certificateId || c.id; }

      async function load() {
        var snap = await DBI.db.collection('certificates').get();
        certs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (c) { return !c.isTemplate; }).sort(function (a, b) { return String(serialOf(b)).localeCompare(String(serialOf(a))); });
        // Serials the old system could hand out twice are listed so they can be revoked and reissued.
        var seen = {}, dup = 0;
        certs.forEach(function (c) { var s = serialOf(c); if (seen[s]) dup++; seen[s] = (seen[s] || 0) + 1; });
        certs.forEach(function (c) { c._dup = seen[serialOf(c)] > 1; });
        var pend = certs.filter(function (c) { return c.status === 'pending'; }).length;
        document.getElementById('sub').textContent = certs.filter(function (c) { return c.status === 'issued'; }).length + ' issued' + (pend ? ' · ' + pend + ' waiting for approval' : '') + (dup ? ' · ' + dup + ' duplicate numbers from the old system' : '');
        draw();
      }

      function filtered() {
        var t = document.getElementById('q').value.trim().toLowerCase();
        var f = document.getElementById('sf').value;
        return certs.filter(function (c) {
          if (f && (c.status || 'issued') !== f) return false;
          return !t || (nameOf(c) + ' ' + c.studentId + ' ' + serialOf(c) + ' ' + (c.assessmentTitle || '')).toLowerCase().indexOf(t) !== -1;
        });
      }
      var BADGE = { issued: ['green', 'Issued'], pending: ['amber', 'Waiting'], revoked: ['red', 'Revoked'] };
      function draw() {
        var rows = filtered();
        var list = document.getElementById('list');
        if (!rows.length) {
          list.innerHTML = '<div class="card empty">' + icon('award') + '<p>' + (certs.length ? 'No certificates match.' : 'No certificates yet.') + '</p></div>';
          return;
        }
        list.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Number</th><th>Student</th><th>For</th><th>Grade</th><th>Status</th><th></th></tr></thead><tbody>' + rows.slice(0, 300).map(function (c) {
          var b = BADGE[c.status || 'issued'] || ['', c.status];
          return '<tr><td><code class="small">' + esc(serialOf(c)) + '</code>' + (c._dup ? ' <span class="badge red">Duplicate</span>' : '') + (c.isManual ? '<div class="muted small">Issued by hand</div>' : '') + '</td>' +
            '<td><b>' + esc(nameOf(c)) + '</b><div class="muted small">' + esc(c.studentId || '') + '</div></td><td class="small">' + esc(c.assessmentTitle || c.eventName || '') + '<div class="muted">' + esc(c.department || '') + ' · ' + esc(c.type === 'achievement' ? 'Achievement' : 'Completion') + '</div></td>' +
            '<td class="small">' + esc(c.grade || '—') + (c.score != null ? ' (' + esc(c.score) + '%)' : '') + '</td><td><span class="badge ' + b[0] + '">' + b[1] + '</span></td>' +
            '<td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end">' +
            (c.status === 'pending' ? '<button class="btn primary sm" data-act="approve" data-id="' + esc(c.id) + '">Approve</button>' : '') +
            '<button class="btn ghost sm" data-act="print" data-id="' + esc(c.id) + '">' + icon('download') + 'Print</button>' +
            (c.status === 'revoked' ? '<button class="btn ghost sm" data-act="restore" data-id="' + esc(c.id) + '">Restore</button>' : '<button class="btn ghost sm" data-act="revoke" data-id="' + esc(c.id) + '">Revoke</button>') +
            '</div></td></tr>';
        }).join('') + '</tbody></table></div>' + (rows.length > 300 ? '<p class="small muted">Showing the first 300. Search to narrow the list.</p>' : '');
      }
      document.getElementById('q').addEventListener('input', draw);
      document.getElementById('sf').addEventListener('change', draw);

      document.getElementById('list').addEventListener('click', async function (e) {
        var b = e.target.closest('[data-act]');
        if (!b) return;
        var c = certs.filter(function (x) { return x.id === b.dataset.id; })[0];
        var ref = DBI.db.collection('certificates').doc(c.id);
        try {
          if (b.dataset.act === 'approve') {
            await ref.update({ status: 'issued', issuedAt: new Date().toISOString(), watermark: null, isLocked: false, approvedBy: me.user.email, updatedAt: new Date().toISOString() });
            DBI.toast('Approved — the student can now see it', 'ok');
          }
          if (b.dataset.act === 'revoke') {
            var reason = await DBI.modal({ title: 'Revoke ' + serialOf(c) + '?', body: '<p>Verification will show this certificate as revoked, and the student will no longer see it.</p><label class="field"><span>Reason</span><input class="input" id="rr"></label>', actions: [{ label: 'Cancel', value: null }, { label: 'Revoke', kind: 'danger', value: function (w) { return w.querySelector('#rr').value.trim() || 'Revoked by admin'; } }] });
            if (!reason) return;
            await ref.update({ status: 'revoked', revokedReason: reason, revokedAt: new Date().toISOString(), revokedBy: me.user.email, updatedAt: new Date().toISOString() });
            DBI.toast('Revoked', 'ok');
          }
          if (b.dataset.act === 'restore') {
            await ref.update({ status: 'issued', revokedReason: FV.delete(), revokedAt: FV.delete(), updatedAt: new Date().toISOString() });
            DBI.toast('Restored', 'ok');
          }
          if (b.dataset.act === 'print') return printCert(c);
          load();
        } catch (err) {
          DBI.toast(err.message, 'error');
        }
      });

      /** A clean, printable certificate in DBI green and blue. */
      function printCert(c) {
        var verify = new URL('../verify.html', location.href).href + '?id=' + encodeURIComponent(serialOf(c));
        var logo = new URL('../images/DBI-Official-Logo.png', location.href).href;
        var w = window.open('', '_blank');
        if (!w) return DBI.toast('Allow pop-ups to print certificates.', 'error');
        var title = c.type === 'achievement' ? 'Certificate of Achievement' : 'Certificate of Completion';
        w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(serialOf(c)) + '</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><style>' +
          '@page{size:A4 landscape;margin:0}body{margin:0;font-family:Inter,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
          '.c{width:297mm;height:210mm;box-sizing:border-box;padding:14mm;position:relative;background:#fff}' +
          '.f{height:100%;box-sizing:border-box;border:3mm solid #03c14b;outline:1.2mm solid #0b7be8;outline-offset:-6mm;padding:14mm 18mm;text-align:center;display:flex;flex-direction:column;align-items:center;position:relative}' +
          '.f img{height:22mm}.t{font-family:"Playfair Display",serif;font-size:34pt;color:#00335f;margin:6mm 0 2mm}.s{color:#475467;letter-spacing:.2em;text-transform:uppercase;font-size:10pt}' +
          '.n{font-family:"Playfair Display",serif;font-size:30pt;color:#0b7be8;border-bottom:1px solid #d0d5dd;padding:0 12mm 2mm;margin:6mm 0 4mm}.p{font-size:13pt;color:#344054;max-width:200mm;line-height:1.5}' +
          '.g{display:inline-block;margin-top:4mm;padding:2mm 6mm;border-radius:99px;background:#e7f9ee;color:#027a33;font-weight:800}.ft{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;font-size:9pt;color:#667085}' +
          '.sig{border-top:1px solid #98a2b3;padding-top:2mm;width:55mm}.wm{position:absolute;inset:0;display:grid;place-items:center;font-size:90pt;font-weight:800;color:rgba(240,68,56,.12);transform:rotate(-20deg);pointer-events:none}' +
          '</style></head><body><div class="c"><div class="f">' + (c.status !== 'issued' ? '<div class="wm">' + esc(c.status === 'revoked' ? 'REVOKED' : 'PENDING') + '</div>' : '') +
          '<img src="' + esc(logo) + '" alt="Digital Bridge Initiative"><div class="t">' + title + '</div><div class="s">This is proudly presented to</div><div class="n">' + esc(nameOf(c)) + '</div>' +
          '<div class="p">for successfully completing <b>' + esc(c.assessmentTitle || c.eventName || 'the programme') + '</b> in the <b>' + esc(c.department || 'General') + '</b> track of the Digital Bridge Initiative.</div>' +
          (c.grade ? '<div class="g">' + esc(c.grade) + (c.score != null ? ' · ' + esc(c.score) + '%' : '') + '</div>' : '') +
          '<div class="ft"><div class="sig">Executive Director</div><div>Certificate No. <b>' + esc(serialOf(c)) + '</b><br>Issued ' + esc(DBI.fmtDate(c.issuedAt || c.createdAt)) + '<br>Verify at ' + esc(verify) + '</div><div class="sig">Head of Department</div></div>' +
          '</div></div><script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>');
        w.document.close();
      }

      document.getElementById('issueBtn').onclick = async function () {
        var as = await DBI.loadAssessments();
        var data = await DBI.modal({
          title: 'Issue a certificate', wide: true,
          body: '<div class="form-grid"><label class="field"><span>Student ID</span><input class="input" id="c_sid" autocapitalize="characters"></label>' +
            '<label class="field"><span>Type</span><select class="input" id="c_type"><option value="completion">Completion</option><option value="achievement">Achievement</option></select></label>' +
            '<label class="field full"><span>For (programme, workshop or test)</span><input class="input" id="c_title" list="c_titles"><datalist id="c_titles">' + as.map(function (a) { return '<option value="' + esc(a.title || '') + '">'; }).join('') + '</datalist></label>' +
            '<label class="field"><span>Department</span><select class="input" id="c_dept">' + DEPARTMENTS.map(function (d) { return '<option>' + d + '</option>'; }).join('') + '</select></label>' +
            '<label class="field"><span>Score % (optional)</span><input class="input" type="number" min="0" max="100" id="c_score"></label></div>' +
            '<label class="check"><input type="checkbox" id="c_pending"><span>Keep it waiting for approval</span></label><p class="hint">The number is allocated by the server, so two certificates can never share one.</p>',
          actions: [{ label: 'Cancel', value: null }, { label: 'Issue', kind: 'primary', value: function (w) {
            var title = w.querySelector('#c_title').value.trim();
            var a = as.filter(function (x) { return x.title === title; })[0];
            return { studentId: w.querySelector('#c_sid').value.trim(), type: w.querySelector('#c_type').value, title: title, department: w.querySelector('#c_dept').value, score: w.querySelector('#c_score').value, pending: w.querySelector('#c_pending').checked, assessmentId: a ? a.id : null };
          }, validate: function (w) {
            if (!w.querySelector('#c_sid').value.trim() || !w.querySelector('#c_title').value.trim()) return DBI.toast('Enter the Student ID and what it is for.', 'error'), false;
            return true;
          } }],
        });
        if (!data) return;
        try {
          var r = await DBI.api('POST', '/admin/certificates/issue', data);
          DBI.toast('Issued ' + r.certificateId, 'ok');
          load();
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
      };

      document.getElementById('csvBtn').onclick = function () {
        DBI.downloadCsv('dbi-certificates.csv', [['Number', 'Student ID', 'Name', 'For', 'Department', 'Type', 'Grade', 'Score', 'Status', 'Issued']].concat(filtered().map(function (c) {
          return [serialOf(c), c.studentId, nameOf(c), c.assessmentTitle || c.eventName || '', c.department, c.type, c.grade, c.score == null ? '' : c.score, c.status || 'issued', c.issuedAt || ''];
        })));
      };

      load().catch(function (e) { document.getElementById('list').innerHTML = '<div class="card empty"><p>' + esc(e.message) + '</p></div>'; });
    })();
  </script>
</body>
</html>
