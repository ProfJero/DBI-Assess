<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessments — DBI Assess Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>Assessments</h1><p>Create tests, set the rules, and publish when the questions are ready.</p></div><button class="btn primary" id="newBtn"></button></div>
    <div class="toolbar"><input class="input" id="q" type="search" placeholder="Search by title or department"><select class="input" id="statusF" style="max-width:180px"><option value="">All statuses</option><option value="draft">Draft</option><option value="published">Published</option><option value="closed">Closed</option><option value="archived">Archived</option></select></div>
    <div id="list"><div class="card skeleton" style="height:120px"></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/grading.js"></script>
  <script src="../shared/admin.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireAdmin();
      DBI.adminShell('assessments', me);
      var esc = DBI.esc, icon = DBI.icon;
      var DEPARTMENTS = ['Digital Skills', 'Software Development', 'Graphics & Multimedia', 'Data Analysis', 'Digital Marketing', 'Cybersecurity', 'Network & Cloud', 'General'];
      var TYPES = [['quiz', 'Quiz'], ['test', 'Class test'], ['exam', 'Exam'], ['final', 'Final exam (achievement certificate)'], ['assignment', 'Assignment'], ['practical', 'Practical'], ['coding', 'Coding'], ['practice', 'Practice (low stakes)']];
      var items = [];
      var defaults = {};
      try {
        var st = await DBI.db.collection('settings').doc('platformSettings').get();
        defaults = st.exists ? st.data() : {};
      } catch (e) {}
      document.getElementById('newBtn').innerHTML = icon('plus') + 'New assessment';
      document.getElementById('newBtn').onclick = function () { edit(null); };
      document.getElementById('q').addEventListener('input', draw);
      document.getElementById('statusF').addEventListener('change', draw);

      async function load() {
        items = await DBI.loadAssessments();
        draw();
      }

      var STATUS = { draft: ['', 'Draft'], published: ['green', 'Published'], closed: ['amber', 'Closed'], archived: ['', 'Archived'] };
      function draw() {
        var term = document.getElementById('q').value.trim().toLowerCase();
        var sf = document.getElementById('statusF').value;
        var shown = items.filter(function (a) {
          return (!sf || (a.status || 'draft') === sf) && (!term || (a.title || '').toLowerCase().indexOf(term) !== -1 || (a.department || '').toLowerCase().indexOf(term) !== -1);
        });
        var list = document.getElementById('list');
        if (!shown.length) {
          list.innerHTML = '<div class="card empty">' + icon('list') + '<p>' + (items.length ? 'No assessments match.' : 'No assessments yet. Create your first one.') + '</p></div>';
          return;
        }
        list.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Assessment</th><th>Status</th><th>Questions</th><th>Time</th><th>Window</th><th></th></tr></thead><tbody>' + shown.map(function (a) {
          var s = STATUS[a.status || 'draft'] || STATUS.draft;
          var opens = a.opensAt || a.startDate, closes = a.closesAt || a.endDate;
          return '<tr><td><b>' + esc(a.title || 'Untitled') + '</b><div class="muted small">' + esc(a.department || '') + (a.type ? ' · ' + esc(a.type) : '') + (a.accessCodeRequired ? ' · ' + icon('lock') + ' code' : '') + '</div></td>' +
            '<td><span class="badge ' + s[0] + '">' + s[1] + '</span></td><td>' + esc(a.totalQuestions || 0) + (a.poolSize ? ' <span class="muted small">(' + esc(a.poolSize) + ' per student)</span>' : '') + '</td>' +
            '<td>' + (Number(a.duration) > 0 ? esc(a.duration) + ' min' : '—') + '</td><td class="small muted">' + (opens ? esc(DBI.fmtDate(DBI.fromLocalInput(DBI.toLocalInput(opens)), true)) : 'Any time') + (closes ? '<br>to ' + esc(DBI.fmtDate(DBI.fromLocalInput(DBI.toLocalInput(closes)), true)) : '') + '</td>' +
            '<td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end">' +
            '<a class="btn ghost sm" href="questions.html?a=' + encodeURIComponent(a.id) + '">Questions</a><a class="btn ghost sm" href="results.html?a=' + encodeURIComponent(a.id) + '">Results</a>' +
            '<button class="btn ghost sm" data-edit="' + esc(a.id) + '">' + icon('edit') + '<span class="sr-only">Edit</span></button>' +
            '<button class="btn ghost sm" data-more="' + esc(a.id) + '" aria-label="More actions">⋯</button></div></td></tr>';
        }).join('') + '</tbody></table></div>';
      }

      document.getElementById('list').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var a = items.filter(function (x) { return x.id === (b.dataset.edit || b.dataset.more); })[0];
        if (b.dataset.edit) edit(a);
        if (b.dataset.more) more(a);
      });

      async function more(a) {
        var actions = [];
        if (a.status !== 'published') actions.push({ label: 'Publish', value: 'publish', kind: 'primary' });
        if (a.status === 'published') actions.push({ label: 'Close now', value: 'close' });
        actions.push({ label: 'Duplicate', value: 'duplicate' }, { label: 'Delete', value: 'delete', kind: 'danger' }, { label: 'Cancel', value: null });
        var v = await DBI.modal({ title: a.title || 'Assessment', body: '<p class="muted">Choose an action.</p>', actions: actions });
        if (v === 'publish') publish(a);
        if (v === 'close') {
          await DBI.db.collection('assessments').doc(a.id).update({ status: 'closed', closedAt: firebase.firestore.FieldValue.serverTimestamp() });
          DBI.toast('Closed. Students can no longer start it.', 'ok');
          load();
        }
        if (v === 'duplicate') duplicate(a);
        if (v === 'delete') remove(a);
      }

      /** Publishing checks every question has a working answer key first. */
      async function publish(a) {
        var qs = await DBI.db.collection('questions').where('assessmentId', '==', a.id).get();
        if (qs.empty) return DBI.modal({ title: 'No questions yet', body: '<p>Add questions before publishing.</p>', actions: [{ label: 'Add questions', value: true, kind: 'primary' }] }).then(function (ok) { if (ok) location.href = 'questions.html?a=' + encodeURIComponent(a.id); });
        var keys = await Promise.all(qs.docs.map(function (d) { return DBI.db.collection('questionKeys').doc(d.id).get(); }));
        var problems = [];
        qs.docs.forEach(function (d, i) {
          var n = DBIGrading.normalizeQuestion(Object.assign({ id: d.id }, d.data()), keys[i].exists ? keys[i].data() : null);
          if (n.warnings.length) problems.push('<li><b>' + esc((d.data().text || '').slice(0, 80)) + '</b>: ' + esc(n.warnings.join(' ')) + '</li>');
        });
        if (problems.length) {
          var go = await DBI.modal({ title: problems.length + ' question' + (problems.length > 1 ? 's need' : ' needs') + ' attention', body: '<p>These would be marked wrongly or sent for manual marking:</p><ul class="small">' + problems.join('') + '</ul>', actions: [{ label: 'Fix questions', value: 'fix', kind: 'primary' }, { label: 'Publish anyway', value: 'publish' }] });
          if (go === 'fix') return (location.href = 'questions.html?a=' + encodeURIComponent(a.id));
          if (go !== 'publish') return;
        }
        await DBI.db.collection('assessments').doc(a.id).update({ status: 'published', totalQuestions: qs.size, publishedAt: firebase.firestore.FieldValue.serverTimestamp() });
        DBI.toast('Published — students can see it now.', 'ok');
        load();
      }

      async function duplicate(a) {
        var copy = Object.assign({}, a);
        delete copy.id;
        copy.title = (a.title || 'Assessment') + ' (copy)';
        copy.status = 'draft';
        copy.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        copy.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        delete copy.publishedAt;
        delete copy.closedAt;
        var ref = DBI.db.collection('assessments').doc();
        var qs = await DBI.db.collection('questions').where('assessmentId', '==', a.id).get();
        var secret = await DBI.db.collection('assessmentSecrets').doc(a.id).get();
        var ops = [function (b) { b.set(ref, copy); }];
        if (secret.exists) ops.push(function (b) { b.set(DBI.db.collection('assessmentSecrets').doc(ref.id), secret.data()); });
        for (var i = 0; i < qs.docs.length; i++) {
          var d = qs.docs[i];
          var key = await DBI.db.collection('questionKeys').doc(d.id).get();
          (function (d, key) {
            var nq = DBI.db.collection('questions').doc();
            ops.push(function (b) { b.set(nq, Object.assign({}, d.data(), { assessmentId: ref.id, copiedFrom: d.id, createdAt: firebase.firestore.FieldValue.serverTimestamp() })); });
            if (key.exists) ops.push(function (b) { b.set(DBI.db.collection('questionKeys').doc(nq.id), Object.assign({}, key.data(), { assessmentId: ref.id })); });
          })(d, key);
        }
        await DBI.batchWrite(ops);
        DBI.toast('Duplicated with ' + qs.size + ' questions.', 'ok');
        load();
      }

      async function remove(a) {
        if (!(await DBI.confirm('Delete “' + (a.title || '') + '”?', 'This deletes the assessment and its questions. Student results are kept for your records. This cannot be undone.', 'Delete', true))) return;
        var qs = await DBI.db.collection('questions').where('assessmentId', '==', a.id).get();
        var ops = [];
        qs.docs.forEach(function (d) {
          ops.push(function (b) { b.delete(d.ref); });
          ops.push(function (b) { b.delete(DBI.db.collection('questionKeys').doc(d.id)); });
        });
        ops.push(function (b) { b.delete(DBI.db.collection('assessmentSecrets').doc(a.id)); });
        ops.push(function (b) { b.delete(DBI.db.collection('assessments').doc(a.id)); });
        await DBI.batchWrite(ops);
        DBI.toast('Deleted', 'ok');
        load();
      }

      // ---------------------------------------------------------------- editor
      function sw(id, label, hint, on) {
        return '<div class="switch-row"><div><b>' + label + '</b>' + (hint ? '<small>' + hint + '</small>' : '') + '</div><label class="switch"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + ' aria-label="' + esc(label) + '"><span></span></label></div>';
      }
      function field(id, label, input, hint, full) {
        return '<label class="field' + (full ? ' full' : '') + '"><span>' + label + '</span>' + input + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
      }

      async function edit(a) {
        var isNew = !a;
        a = a || {
          status: 'draft', type: 'quiz', department: 'Digital Skills', duration: defaults.defaultTimeLimit || 30, attempts: defaults.defaultAttempts || 1,
          passingScore: defaults.defaultPassingScore || 50, answerDisplay: 'end', showEndScore: true, showEndCorrect: true, showEndFeedback: true, randomQuestions: true, randomOptions: true, gracePeriod: 2,
          antiCheat: { monitorTabs: true, monitorMinimize: true, disableCopy: true, disablePaste: true, disableRightClick: true, disablePrint: true, watermark: true, singleDevice: true, warnings: 3, violationAction: 'flag', blurOnLeave: true },
          certificate: { enabled: false, minScore: 70, template: 'default' },
        };
        var ac = a.antiCheat || {};
        var cert = a.certificate || {};
        var secret = '';
        if (!isNew) {
          try {
            var s = await DBI.db.collection('assessmentSecrets').doc(a.id).get();
            secret = s.exists ? s.data().accessCode || '' : '';
          } catch (e) {}
        }
        var form = document.createElement('form');
        form.innerHTML =
          '<div class="tabbar" role="tablist">' + ['Basics', 'Timing', 'Questions', 'Results', 'Security', 'Certificate'].map(function (t, i) { return '<button type="button" role="tab" data-tab="' + i + '" aria-selected="' + (i === 0) + '">' + t + '</button>'; }).join('') + '</div>' +
          '<section data-pane="0"><div class="form-grid">' +
          field('f_title', 'Title', '<input class="input" id="f_title" required value="' + esc(a.title || '') + '">', '', true) +
          field('f_type', 'Type', '<select class="input" id="f_type">' + TYPES.map(function (t) { return '<option value="' + t[0] + '"' + (a.type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') + '</select>') +
          field('f_dept', 'Department / programme', '<select class="input" id="f_dept">' + DEPARTMENTS.map(function (d) { return '<option' + (a.department === d ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select>', 'Used for certificate numbers.') +
          field('f_desc', 'Short description', '<textarea class="input" id="f_desc" rows="2">' + esc(a.description || '') + '</textarea>', 'Shown on the student’s test card.', true) +
          field('f_inst', 'Instructions for students', '<textarea class="input" id="f_inst" rows="3">' + esc(a.instructions || '') + '</textarea>', 'Shown before the test starts. Keep it short and simple.', true) +
          field('f_aud', 'Who can take it', '<select class="input" id="f_aud"><option value="all">All students</option><option value="list"' + (a.audience && a.audience.type === 'list' ? ' selected' : '') + '>Only these Student IDs</option></select>') +
          field('f_ids', 'Student IDs (if limited)', '<textarea class="input" id="f_ids" rows="2" placeholder="DBI-25-001, DBI-25-002">' + esc(a.audience && a.audience.studentIds ? a.audience.studentIds.join(', ') : '') + '</textarea>', 'Separate with commas or new lines.') +
          '</div></section>' +
          '<section data-pane="1" hidden><div class="form-grid">' +
          field('f_open', 'Opens', '<input class="input" type="datetime-local" id="f_open" value="' + esc(DBI.toLocalInput(a.opensAt || a.startDate)) + '">', 'Leave empty to open as soon as it is published.') +
          field('f_close', 'Closes', '<input class="input" type="datetime-local" id="f_close" value="' + esc(DBI.toLocalInput(a.closesAt || a.endDate)) + '">', 'No new starts after this; running tests end here too.') +
          field('f_dur', 'Time limit (minutes)', '<input class="input" type="number" min="0" id="f_dur" value="' + esc(a.duration === 0 ? 0 : a.duration || 30) + '">', '0 = no time limit.') +
          field('f_grace', 'Grace period (minutes)', '<input class="input" type="number" min="0" max="60" id="f_grace" value="' + esc(a.gracePeriod === 0 ? 0 : a.gracePeriod || 2) + '">', 'Extra seconds for answers still uploading when time runs out.') +
          field('f_att', 'Attempts allowed', '<input class="input" type="number" min="1" id="f_att" value="' + esc(a.unlimitedAttempts ? 1 : a.attempts || 1) + '">') +
          '<div class="field">' + sw('f_unl', 'Unlimited attempts', 'Good for practice tests.', a.unlimitedAttempts) + '</div>' +
          field('f_qtime', 'Time per question (seconds)', '<input class="input" type="number" min="0" id="f_qtime" value="' + esc(ac.questionTimeLimit || 0) + '">', '0 = off. When on, students cannot go back.') +
          '</div></section>' +
          '<section data-pane="2" hidden>' +
          sw('f_rq', 'Shuffle question order', 'Each student gets their own order — stops copying from neighbours.', a.randomQuestions) +
          sw('f_ro', 'Shuffle answer options', 'A, B, C, D are in a different order for each student.', a.randomOptions) +
          field('f_pool', 'Random pool: questions per student', '<input class="input" type="number" min="0" id="f_pool" value="' + esc(a.poolSize || 0) + '">', '0 = everyone gets all questions. E.g. 20 picks 20 random questions from the bank for each student.') +
          sw('f_one', 'One question per screen', 'Recommended on phones.', a.onePerPage !== false) +
          sw('f_back', 'Allow going back to earlier questions', 'Turn off for stricter exams.', a.allowBack !== false) +
          sw('f_timer', 'Show the timer', '', a.showTimer !== false) +
          sw('f_prog', 'Show progress bar', '', a.showProgress !== false) +
          '</section>' +
          '<section data-pane="3" hidden><div class="form-grid">' +
          field('f_disp', 'When students see results', '<select class="input" id="f_disp">' + [['end', 'Right after submitting (if no manual marking is needed)'], ['per-question', 'After each question (practice mode, needs internet)'], ['release', 'When I release them'], ['none', 'Score only, when I release them']].map(function (o) { return '<option value="' + o[0] + '"' + ((a.answerDisplay || 'end') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>', 'Written answers always wait for a teacher to mark them.', true) +
          field('f_pass', 'Pass mark (%)', '<input class="input" type="number" min="0" max="100" id="f_pass" value="' + esc(a.passingScore === 0 ? 0 : a.passingScore || 50) + '">') +
          field('f_neg', 'Negative marking', '<select class="input" id="f_neg">' + [[0, 'Off'], [0.25, 'Lose ¼ of the mark for a wrong answer'], [0.5, 'Lose ½ of the mark'], [1, 'Lose the full mark']].map(function (o) { return '<option value="' + o[0] + '"' + (Number(a.negativeMarking || 0) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>', 'Blank answers never lose marks.') +
          '</div>' +
          sw('f_score', 'Show score', '', a.showEndScore !== false) +
          sw('f_corr', 'Show correct answers', 'Tip: for tests with more than one attempt, turn this off until the test closes.', !!(a.showEndCorrect || a.showCorrectAnswers)) +
          sw('f_fb', 'Show explanations', '', !!(a.showEndFeedback || a.showFeedback)) +
          sw('f_partial', 'Partial credit', 'Multi-select, matching, ordering and multi-blank questions earn marks for each correct part.', a.partialCredit !== false) +
          '</section>' +
          '<section data-pane="4" hidden>' +
          '<div class="form-grid">' + field('f_code', 'Access code', '<div class="row" style="flex-wrap:nowrap"><input class="input" id="f_code" autocomplete="off" value="' + esc(secret) + '" placeholder="Leave empty for no code"><button type="button" class="btn ghost sm" id="genCode">Generate</button></div>', 'Students need this to start. Tell them in class.') +
          field('f_warn', 'Violation limit', '<input class="input" type="number" min="0" id="f_warn" value="' + esc(ac.warnings || 0) + '">', '0 = record only. Counts leaving the test, copying, etc.') +
          field('f_vact', 'When the limit is reached', '<select class="input" id="f_vact">' + [['flag', 'Flag the attempt for me (recommended)'], ['lock', 'Pause the test until I unlock it'], ['submit', 'Submit the test automatically']].map(function (o) { return '<option value="' + o[0] + '"' + ((ac.violationAction || 'flag') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>', 'Phones lose focus for calls and notifications, so flagging is the fairest.') + '</div>' +
          sw('ac_tabs', 'Detect leaving the test (tab or app switch)', 'Most reliable check on phones.', ac.monitorTabs !== false) +
          sw('ac_min', 'Detect clicking outside the window', 'Computers only.', ac.monitorMinimize !== false) +
          sw('ac_full', 'Require full screen', 'Computers and Android. iPhones cannot enter full screen.', !!ac.fullScreen) +
          sw('ac_blur', 'Hide questions when the test loses focus', '', ac.blurOnLeave !== false) +
          sw('ac_copy', 'Block copying', '', !!ac.disableCopy) +
          sw('ac_paste', 'Block pasting', 'Stops pasting answers from elsewhere.', !!ac.disablePaste) +
          sw('ac_rc', 'Block right-click / long-press menu', '', !!ac.disableRightClick) +
          sw('ac_sel', 'Block selecting question text', '', !!ac.disableSelection) +
          sw('ac_print', 'Block printing and record Print Screen', '', !!ac.disablePrint) +
          sw('ac_dev', 'Detect developer tools (computers)', 'Low confidence; shown as “possible”.', !!ac.monitorDevTools) +
          sw('ac_reload', 'Record page reloads', '', !!ac.monitorRefresh) +
          sw('ac_wm', 'Show student name watermark', 'Discourages photos of the screen.', ac.watermark !== false) +
          sw('ac_single', 'One device at a time', 'The test can only be open on one device. Moving devices is recorded.', ac.singleDevice !== false) +
          sw('ac_pledge', 'Honesty pledge before starting', '', !!ac.pledge) +
          '<p class="alert small" style="margin-top:12px">' + icon('shield') + '<span>Answer keys never leave the server, the timer runs on the server, and every student gets their own question order. Browser checks are recorded with times so you can judge each case.</span></p>' +
          '</section>' +
          '<section data-pane="5" hidden>' +
          sw('c_on', 'Issue a certificate when a student passes', '', !!cert.enabled) +
          '<div class="form-grid">' + field('c_min', 'Minimum score for a certificate (%)', '<input class="input" type="number" min="0" max="100" id="c_min" value="' + esc(cert.minScore === 0 ? 0 : cert.minScore || 70) + '">') +
          field('c_tpl', 'Template', '<select class="input" id="c_tpl">' + ['default', 'premium', 'simple'].map(function (t) { return '<option' + ((cert.template || 'default') === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>') + '</div>' +
          sw('c_lock', 'Hold certificates for my approval', 'Certificates are created as “pending” until you release them on the Certificates page.', !!cert.lockOnGenerate) +
          '</section>';
        form.addEventListener('click', function (e) {
          var t = e.target.closest('[data-tab]');
          if (t) {
            form.querySelectorAll('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', x === t); });
            form.querySelectorAll('[data-pane]').forEach(function (p) { p.hidden = p.dataset.pane !== t.dataset.tab; });
          }
          if (e.target.id === 'genCode') {
            var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
            var code = '';
            crypto.getRandomValues(new Uint8Array(6)).forEach(function (n) { code += chars[n % chars.length]; });
            form.querySelector('#f_code').value = code;
          }
        });
        var saved = await DBI.modal({
          title: isNew ? 'New assessment' : 'Edit assessment',
          wide: true,
          body: form,
          actions: [{ label: 'Cancel', value: null }, {
            label: isNew ? 'Create' : 'Save', kind: 'primary', value: function () { return true; },
            validate: function () {
              if (!form.querySelector('#f_title').value.trim()) {
                DBI.toast('Give the assessment a title.', 'error');
                return false;
              }
              var o = form.querySelector('#f_open').value, c = form.querySelector('#f_close').value;
              if (o && c && new Date(c) <= new Date(o)) {
                DBI.toast('The closing time must be after the opening time.', 'error');
                return false;
              }
              return true;
            },
          }],
        });
        if (!saved) return;
        var v = function (id) { return form.querySelector('#' + id).value; };
        var on = function (id) { return form.querySelector('#' + id).checked; };
        var num = function (id, def) { var n = Number(v(id)); return isNaN(n) ? def : n; };
        var ids = v('f_ids').split(/[\s,;]+/).map(function (x) { return x.trim().toUpperCase(); }).filter(Boolean);
        var code = v('f_code').trim().toUpperCase();
        var data = {
          title: v('f_title').trim(), type: v('f_type'), department: v('f_dept'), description: v('f_desc').trim(), instructions: v('f_inst').trim(),
          audience: v('f_aud') === 'list' ? { type: 'list', studentIds: ids } : { type: 'all' },
          opensAt: DBI.fromLocalInput(v('f_open')), closesAt: DBI.fromLocalInput(v('f_close')), startDate: null, endDate: null,
          duration: Math.max(0, num('f_dur', 30)), gracePeriod: Math.max(0, num('f_grace', 2)), attempts: on('f_unl') ? 999 : Math.max(1, num('f_att', 1)), unlimitedAttempts: on('f_unl'),
          randomQuestions: on('f_rq'), randomOptions: on('f_ro'), poolSize: Math.max(0, num('f_pool', 0)), onePerPage: on('f_one'), allowBack: on('f_back'), showTimer: on('f_timer'), showProgress: on('f_prog'),
          answerDisplay: v('f_disp'), passingScore: Math.min(100, Math.max(0, num('f_pass', 50))), negativeMarking: num('f_neg', 0), partialCredit: on('f_partial'),
          showEndScore: on('f_score'), showScore: on('f_score'), showEndCorrect: on('f_corr'), showCorrectAnswers: on('f_corr'), showEndFeedback: on('f_fb'), showFeedback: on('f_fb'),
          accessCodeRequired: !!code,
          antiCheat: {
            monitorTabs: on('ac_tabs'), monitorMinimize: on('ac_min'), fullScreen: on('ac_full'), blurOnLeave: on('ac_blur'), disableCopy: on('ac_copy'), disablePaste: on('ac_paste'), disableRightClick: on('ac_rc'),
            disableSelection: on('ac_sel'), disablePrint: on('ac_print'), monitorDevTools: on('ac_dev'), monitorRefresh: on('ac_reload'), watermark: on('ac_wm'), singleDevice: on('ac_single'), pledge: on('ac_pledge'),
            warnings: Math.max(0, num('f_warn', 0)), violationAction: v('f_vact'), questionTimeLimit: Math.max(0, num('f_qtime', 0)),
          },
          certificate: { enabled: on('c_on'), minScore: Math.min(100, Math.max(0, num('c_min', 70))), template: v('c_tpl'), lockOnGenerate: on('c_lock'), autoGenerate: true },
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        };
        if (data.antiCheat.questionTimeLimit) data.allowBack = false;
        try {
          var ref = isNew ? DBI.db.collection('assessments').doc() : DBI.db.collection('assessments').doc(a.id);
          var batch = DBI.db.batch();
          if (isNew) batch.set(ref, Object.assign(data, { status: 'draft', totalQuestions: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: me.user.uid }));
          else batch.update(ref, data);
          // The access code lives in a separate, admin-only document so students cannot read it.
          if (code) batch.set(DBI.db.collection('assessmentSecrets').doc(ref.id), { accessCode: code, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          else batch.delete(DBI.db.collection('assessmentSecrets').doc(ref.id));
          await batch.commit();
          DBI.toast(isNew ? 'Created. Now add questions.' : 'Saved', 'ok');
          if (isNew) location.href = 'questions.html?a=' + encodeURIComponent(ref.id);
          else load();
        } catch (e) {
          DBI.toast('Could not save: ' + e.message, 'error');
        }
      }

      load().catch(function (e) { document.getElementById('list').innerHTML = '<div class="card empty"><p>' + esc(e.message) + '</p></div>'; });
    })();
  </script>
</body>
</html>
