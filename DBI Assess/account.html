<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admins — DBI Assess Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/ui.css">
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>Administrators</h1><p>Only administrators can open this page. Each admin signs in with their own email.</p></div><button class="btn primary" id="addBtn"></button></div>
    <div id="list"><div class="card skeleton" style="height:120px"></div></div>
    <section class="card" style="margin-top:16px"><h2 style="font-size:1.1rem">Your account</h2><p class="small muted" id="meLine"></p><button class="btn ghost" id="resetBtn"></button></section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="shared/config.js"></script>
  <script src="shared/core.js"></script>
  <script src="shared/admin.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireAdmin();
      DBI.adminShell('account', me);
      var esc = DBI.esc, icon = DBI.icon, FV = firebase.firestore.FieldValue;
      var ROLES = { owner: 'Owner', admin: 'Administrator', teacher: 'Teacher (marking)' };
      document.getElementById('addBtn').innerHTML = icon('plus') + 'Add admin';
      document.getElementById('resetBtn').innerHTML = icon('lock') + 'Email me a password reset link';
      document.getElementById('meLine').textContent = 'Signed in as ' + me.user.email + '.';
      document.getElementById('resetBtn').onclick = async function () {
        try {
          await DBI.auth.sendPasswordResetEmail(me.user.email);
          DBI.toast('Reset link sent to ' + me.user.email, 'ok');
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
      };

      async function load() {
        var snap = await DBI.db.collection('admins').get();
        var rows = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return String(a.email).localeCompare(String(b.email)); });
        document.getElementById('list').innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Added</th><th></th></tr></thead><tbody>' + rows.map(function (a) {
          var self = a.id === me.user.uid;
          return '<tr><td><b>' + esc(a.name || '—') + '</b>' + (self ? ' <span class="badge blue">You</span>' : '') + '<div class="muted small">' + esc(a.email || '') + '</div></td><td>' + esc(ROLES[a.role] || a.role || 'Administrator') + '</td><td class="small">' + esc(DBI.fmtDate(a.createdAt)) + '</td>' +
            '<td style="text-align:right">' + (self ? '' : '<button class="btn ghost sm" data-rm="' + esc(a.id) + '" data-email="' + esc(a.email || '') + '">' + icon('trash') + 'Remove</button>') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      }

      document.getElementById('list').addEventListener('click', async function (e) {
        var b = e.target.closest('[data-rm]');
        if (!b) return;
        if (!(await DBI.confirm('Remove ' + (b.dataset.email || 'this admin') + '?', 'They will no longer be able to open the admin pages. Their sign-in account stays but has no access.', 'Remove', true))) return;
        await DBI.db.collection('admins').doc(b.dataset.rm).delete();
        DBI.toast('Removed', 'ok');
        load();
      });

      document.getElementById('addBtn').onclick = async function () {
        var data = await DBI.modal({
          title: 'Add an administrator',
          body: '<label class="field"><span>Full name</span><input class="input" id="a_name"></label><label class="field"><span>Email</span><input class="input" type="email" id="a_email"></label>' +
            '<label class="field"><span>Role</span><select class="input" id="a_role"><option value="admin">Administrator</option><option value="teacher">Teacher (marking)</option><option value="owner">Owner</option></select></label>' +
            '<label class="field"><span>Temporary password</span><input class="input" id="a_pw" autocomplete="off"><span class="hint">At least 8 characters. Ask them to change it with “Forgot password?”.</span></label>',
          actions: [{ label: 'Cancel', value: null }, {
            label: 'Add admin', kind: 'primary',
            value: function (w) { return { name: w.querySelector('#a_name').value.trim(), email: w.querySelector('#a_email').value.trim().toLowerCase(), role: w.querySelector('#a_role').value, pw: w.querySelector('#a_pw').value }; },
            validate: function (w) {
              if (!/^\S+@\S+\.\S+$/.test(w.querySelector('#a_email').value.trim())) return DBI.toast('Enter a valid email.', 'error'), false;
              if (w.querySelector('#a_pw').value.length < 8) return DBI.toast('Use at least 8 characters.', 'error'), false;
              return true;
            },
          }],
        });
        if (!data) return;
        // A second Firebase app creates the account without signing the current admin out.
        var second = firebase.apps.filter(function (a) { return a.name === 'adminCreator'; })[0] || firebase.initializeApp(DBI.config.firebase, 'adminCreator');
        var sAuth = second.auth();
        if (DBI.config.emulator && !second._emu) {
          sAuth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true });
          second._emu = true;
        }
        try {
          var cred;
          try {
            cred = await sAuth.createUserWithEmailAndPassword(data.email, data.pw);
          } catch (e) {
            if (e.code !== 'auth/email-already-in-use') throw e;
            cred = await sAuth.signInWithEmailAndPassword(data.email, data.pw).catch(function () {
              throw new Error('That email already has an account. Enter its current password to give it admin access.');
            });
          }
          await DBI.db.collection('admins').doc(cred.user.uid).set({ name: data.name, email: data.email, role: data.role, createdAt: FV.serverTimestamp(), createdBy: me.user.email });
          await sAuth.signOut();
          DBI.toast(data.email + ' is now an admin', 'ok');
          load();
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
      };

      load().catch(function (e) { document.getElementById('list').innerHTML = '<div class="card empty"><p>' + esc(e.message) + '</p></div>'; });
    })();
  </script>
</body>
</html>
