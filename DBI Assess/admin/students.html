<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students — DBI Assess Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>Students</h1><p id="sub">Accounts, passwords and extra time.</p></div>
      <div class="row"><button class="btn ghost" id="bulkBtn"></button><button class="btn ghost" id="regBtn"></button><button class="btn primary" id="addBtn"></button></div></div>
    <div id="banner"></div>
    <div class="toolbar"><input class="input" id="q" type="search" placeholder="Search name, Student ID, school"><select class="input" id="sf" style="max-width:180px"><option value="">Everyone</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="extra">Has extra time</option></select><button class="btn ghost sm" id="csvBtn"></button></div>
    <div id="list"><div class="card skeleton" style="height:160px"></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/admin.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireAdmin();
      DBI.adminShell('students', me);
      var esc = DBI.esc, icon = DBI.icon;
      var students = [], shown = 50;
      document.getElementById('addBtn').innerHTML = icon('plus') + 'Add student';
      document.getElementById('bulkBtn').innerHTML = icon('upload') + 'Add many (CSV)';
      document.getElementById('regBtn').innerHTML = icon('refresh') + 'Import from DBI registry';
      document.getElementById('csvBtn').innerHTML = icon('download') + 'Export';

      function sidKey(s) { return String(s || '').trim().toUpperCase(); }
      function fullName(u) { return ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || '—'; }
      function genPassword() {
        var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
        var out = '';
        crypto.getRandomValues(new Uint8Array(8)).forEach(function (n) { out += chars[n % chars.length]; });
        return out;
      }

      async function load() {
        var snap = await DBI.db.collection('users').get();
        var all = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (u) { return u.studentId; });
        // After the password upgrade each student has users/stu_<ID>; hide the older random-id copies.
        var canonical = {};
        all.forEach(function (u) { if (u.id === 'stu_' + sidKey(u.studentId)) canonical[sidKey(u.studentId)] = true; });
        students = all.filter(function (u) { return u.id === 'stu_' + sidKey(u.studentId) || !canonical[sidKey(u.studentId)]; }).sort(function (a, b) { return sidKey(a.studentId).localeCompare(sidKey(b.studentId)); });
        var plain = all.filter(function (u) { return u.password; }).length;
        document.getElementById('banner').innerHTML = plain ? '<div class="alert error" style="margin-bottom:14px">' + icon('lock') + '<span><b>' + plain + ' password' + (plain > 1 ? 's are' : ' is') + ' stored as plain text</b> from the old system. Anyone with database access can read them. <a href="#" id="secure">Protect them now</a> — students keep the same password.</span></div>' : '';
        var sec = document.getElementById('secure');
        if (sec) sec.onclick = secure;
        document.getElementById('sub').textContent = students.length + ' students · ' + students.filter(function (u) { return u.status === 'suspended'; }).length + ' suspended';
        draw();
      }

      function filtered() {
        var t = document.getElementById('q').value.trim().toLowerCase();
        var f = document.getElementById('sf').value;
        return students.filter(function (u) {
          if (f === 'active' && u.status === 'suspended') return false;
          if (f === 'suspended' && u.status !== 'suspended') return false;
          if (f === 'extra' && !(Number(u.extraTimePercent) > 0)) return false;
          return !t || (fullName(u) + ' ' + u.studentId + ' ' + (u.school || '') + ' ' + (u.email || '')).toLowerCase().indexOf(t) !== -1;
        });
      }
      function draw() {
        var rows = filtered();
        var list = document.getElementById('list');
        if (!rows.length) {
          list.innerHTML = '<div class="card empty">' + icon('user') + '<p>' + (students.length ? 'No students match.' : 'No students yet. Add them one by one, from a CSV file, or import from the DBI registry.') + '</p></div>';
          return;
        }
        list.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>School / community</th><th>Status</th><th>Extra time</th><th></th></tr></thead><tbody>' + rows.slice(0, shown).map(function (u) {
          return '<tr><td><b>' + esc(fullName(u)) + '</b><div class="muted small">' + esc(u.studentId) + (u.email ? ' · ' + esc(u.email) : '') + '</div></td><td class="small">' + esc(u.school || u.community || '—') + (u.educationLevel ? '<div class="muted">' + esc(u.educationLevel) + '</div>' : '') + '</td>' +
            '<td>' + (u.status === 'suspended' ? '<span class="badge red">Suspended</span>' : '<span class="badge green">Active</span>') + '</td><td>' + (Number(u.extraTimePercent) > 0 ? '<span class="badge blue">+' + esc(u.extraTimePercent) + '%</span>' : '—') + '</td>' +
            '<td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><button class="btn ghost sm" data-pw="' + esc(u.id) + '">' + icon('lock') + 'Password</button><button class="btn ghost sm" data-edit="' + esc(u.id) + '" aria-label="Edit ' + esc(fullName(u)) + '">' + icon('edit') + '</button><a class="btn ghost sm" href="results.html?student=' + encodeURIComponent(u.studentId) + '" hidden></a></div></td></tr>';
        }).join('') + '</tbody></table></div>' + (rows.length > shown ? '<div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" id="more">Show more (' + (rows.length - shown) + ')</button></div>' : '');
        var more = document.getElementById('more');
        if (more) more.onclick = function () { shown += 100; draw(); };
      }
      document.getElementById('q').addEventListener('input', function () { shown = 50; draw(); });
      document.getElementById('sf').addEventListener('change', function () { shown = 50; draw(); });
      document.getElementById('list').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var u = students.filter(function (x) { return x.id === (b.dataset.pw || b.dataset.edit); })[0];
        if (b.dataset.pw) setPassword(u);
        if (b.dataset.edit) edit(u);
      });

      async function setPassword(u) {
        var pw = genPassword();
        var v = await DBI.modal({
          title: 'New password for ' + fullName(u),
          body: '<p class="small muted">Student ID: <b>' + esc(u.studentId) + '</b></p><label class="field"><span>New password</span><input class="input" id="npw" value="' + esc(pw) + '" autocomplete="off"></label><p class="hint">Write it down and give it to the student. It is stored securely, so it cannot be shown again.</p>',
          actions: [{ label: 'Cancel', value: null }, { label: 'Set password', kind: 'primary', value: function (w) { return w.querySelector('#npw').value; } }],
        });
        if (!v) return;
        try {
          await DBI.api('POST', '/admin/students/password', { studentId: u.studentId, password: v });
          DBI.toast('Password updated for ' + u.studentId, 'ok');
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
      }

      function form(u) {
        u = u || {};
        var f = function (id, label, val, extra) { return '<label class="field"><span>' + label + '</span><input class="input" id="' + id + '" value="' + esc(val || '') + '"' + (extra || '') + '></label>'; };
        return '<div class="form-grid">' + f('s_id', 'Student ID', u.studentId, u.studentId ? ' readonly' : ' placeholder="e.g. DBI-25-001" autocapitalize="characters"') + '<span></span>' +
          f('s_first', 'First name', u.firstName) + f('s_last', 'Last name', u.lastName) + f('s_email', 'Email', u.email, ' type="email"') + f('s_phone', 'Phone', u.phone, ' type="tel"') + f('s_school', 'School', u.school) + f('s_comm', 'Community', u.community) +
          '<label class="field"><span>Level</span><select class="input" id="s_level">' + ['', 'JHS', 'SHS', 'Tertiary', 'Other'].map(function (l) { return '<option' + (u.educationLevel === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select></label>' +
          '<label class="field"><span>Extra time (%)</span><input class="input" type="number" min="0" max="200" step="5" id="s_extra" value="' + esc(u.extraTimePercent || 0) + '"><span class="hint">For students who need more time, e.g. 25 = 25% longer on every timed test.</span></label>' +
          '<label class="field full"><span>Status</span><select class="input" id="s_status"><option value="active">Active — can sign in</option><option value="suspended"' + (u.status === 'suspended' ? ' selected' : '') + '>Suspended — cannot sign in</option></select></label>' +
          (u.studentId ? '' : '<label class="field full"><span>Password</span><input class="input" id="s_pw" value="' + esc(genPassword()) + '" autocomplete="off"><span class="hint">Give this to the student. They can change it on their profile page.</span></label>') + '</div>';
      }
      function read(w) {
        var v = function (id) { var el = w.querySelector('#' + id); return el ? el.value.trim() : ''; };
        return { studentId: sidKey(v('s_id')), firstName: v('s_first'), lastName: v('s_last'), email: v('s_email'), phone: v('s_phone'), school: v('s_school'), community: v('s_comm'), educationLevel: v('s_level'), status: v('s_status'), extraTimePercent: Math.max(0, Math.min(200, Number(v('s_extra')) || 0)), password: v('s_pw') };
      }

      async function edit(u) {
        var data = await DBI.modal({ title: 'Edit student', wide: true, body: form(u), actions: [{ label: 'Cancel', value: null }, { label: 'Save', kind: 'primary', value: read }] });
        if (!data) return;
        delete data.password;
        delete data.studentId;
        data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        try {
          await DBI.db.collection('users').doc(u.id).update(data);
          DBI.toast('Saved', 'ok');
          load();
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
      }

      document.getElementById('addBtn').onclick = async function () {
        var data = await DBI.modal({
          title: 'Add student', wide: true, body: form(null),
          actions: [{ label: 'Cancel', value: null }, {
            label: 'Add student', kind: 'primary', value: read,
            validate: function (w) {
              var d = read(w);
              if (!/^[A-Z0-9][A-Z0-9-_/]{2,}$/.test(d.studentId)) return DBI.toast('Enter a valid Student ID.', 'error'), false;
              if (!d.firstName) return DBI.toast('Enter the first name.', 'error'), false;
              if (d.password.length < 6) return DBI.toast('The password needs at least 6 characters.', 'error'), false;
              if (students.some(function (s) { return sidKey(s.studentId) === d.studentId; })) return DBI.toast('That Student ID already exists.', 'error'), false;
              return true;
            },
          }],
        });
        if (!data) return;
        try {
          var pw = data.password;
          var extra = data.extraTimePercent;
          delete data.password;
          var r = await DBI.api('POST', '/admin/students/password', { studentId: data.studentId, password: pw, profile: data });
          if (extra) await DBI.db.collection('users').doc(r.uid).update({ extraTimePercent: extra });
          DBI.modal({ title: 'Student added', body: '<p>Give these sign-in details to the student:</p><dl class="kv"><dt>Student ID</dt><dd>' + esc(data.studentId) + '</dd><dt>Password</dt><dd><code>' + esc(pw) + '</code></dd></dl>' });
          load();
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
      };

      document.getElementById('bulkBtn').onclick = async function () {
        var w = document.createElement('div');
        w.innerHTML = '<p class="small">CSV columns: <code>studentId, firstName, lastName, email, phone, school, password</code>. Leave password empty to generate one. You will download a list of the new passwords.</p><input class="input" type="file" id="bf" accept=".csv,text/csv"><div id="bp" class="small" style="margin-top:10px"></div>';
        var rows = [];
        w.querySelector('#bf').onchange = async function (e) {
          var text = (await e.target.files[0].text()).replace(/^﻿/, '');
          var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
          var head = lines.shift().split(',').map(function (h) { return h.trim().replace(/^"|"$/g, '').toLowerCase(); });
          rows = lines.map(function (l) {
            var cells = l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(function (c) { return c.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"').trim(); });
            var o = {};
            head.forEach(function (h, i) { o[h] = cells[i] || ''; });
            return { studentId: sidKey(o.studentid || o['student id'] || o.id), firstName: o.firstname || o['first name'] || '', lastName: o.lastname || o['last name'] || '', email: o.email || '', phone: o.phone || '', school: o.school || '', password: o.password || genPassword() };
          }).filter(function (r) { return r.studentId; });
          w.querySelector('#bp').textContent = rows.length + ' students found.';
        };
        if (!(await DBI.modal({ title: 'Add many students', body: w, actions: [{ label: 'Cancel', value: null }, { label: 'Add students', kind: 'primary', value: true }] })) || !rows.length) return;
        var out = [['Student ID', 'Name', 'Password', 'Result']];
        var bar = document.getElementById('banner');
        for (var i = 0; i < rows.length; i++) {
          bar.innerHTML = '<div class="alert" style="margin-bottom:14px"><span class="spin"></span><span>Adding ' + (i + 1) + ' of ' + rows.length + '…</span></div>';
          var r = rows[i];
          var pw = r.password;
          delete r.password;
          try {
            await DBI.api('POST', '/admin/students/password', { studentId: r.studentId, password: pw, profile: r }, { retries: 2 });
            out.push([r.studentId, r.firstName + ' ' + r.lastName, pw, 'added']);
          } catch (e) {
            out.push([r.studentId, r.firstName + ' ' + r.lastName, '', e.message]);
          }
        }
        DBI.downloadCsv('dbi-new-student-passwords.csv', out);
        DBI.toast('Done. Keep the downloaded password list safe.', 'ok', 6000);
        load();
      };

      document.getElementById('regBtn').onclick = async function () {
        if (!(await DBI.confirm('Import students from the DBI registry?', 'Names, schools and contact details are copied. Existing students are updated, nobody is removed, and passwords are protected the first time each student signs in.', 'Import'))) return;
        var b = this;
        DBI.busy(b, true, 'Importing…');
        try {
          var r = await DBI.api('POST', '/admin/students/import', {}, { timeout: 120000 });
          DBI.toast('Imported or updated ' + r.imported + ' students', 'ok');
          load();
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
        DBI.busy(b, false);
      };

      async function secure(e) {
        if (e) e.preventDefault();
        try {
          var r = await DBI.api('POST', '/admin/students/secure-passwords', {}, { timeout: 120000 });
          DBI.toast('Protected ' + r.hashed + ' passwords', 'ok');
          load();
        } catch (err) {
          DBI.toast(err.message, 'error');
        }
      }

      document.getElementById('csvBtn').onclick = function () {
        DBI.downloadCsv('dbi-students.csv', [['Student ID', 'First name', 'Last name', 'Email', 'Phone', 'School', 'Community', 'Level', 'Status', 'Extra time %']].concat(filtered().map(function (u) {
          return [u.studentId, u.firstName, u.lastName, u.email, u.phone, u.school, u.community, u.educationLevel, u.status || 'active', u.extraTimePercent || 0];
        })));
      };

      load().catch(function (e) { document.getElementById('list').innerHTML = '<div class="card empty"><p>' + esc(e.message) + '</p></div>'; });
    })();
  </script>
</body>
</html>
