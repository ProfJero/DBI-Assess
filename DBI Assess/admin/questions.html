<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questions — DBI Assess Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .qcard-admin { display: flex; gap: 12px; align-items: flex-start; }
    .qcard-admin + .qcard-admin { margin-top: 10px; }
    .qcard-admin .body { flex: 1; min-width: 0; }
    .qcard-admin .qtext { font-weight: 600; margin: 4px 0 6px; overflow-wrap: anywhere; }
    .qcard-admin .key { font-size: .88rem; color: var(--ink-2); }
    .qcard-admin .key .ok { color: var(--green-700); font-weight: 700; }
    .qcard-admin .acts { display: flex; flex-direction: column; gap: 4px; }
    .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .opt-row .input { min-height: 44px; }
    .opt-row input[type=radio], .opt-row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--green); flex-shrink: 0; }
    .opt-row .lbl { width: 26px; font-weight: 800; color: var(--muted); text-align: center; flex-shrink: 0; }
    .try { margin-top: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; background: #fcfcfd; }
    .thumb { max-width: 220px; max-height: 140px; border-radius: 10px; border: 1px solid var(--line); display: block; margin-top: 8px; }
    .seg { display: inline-flex; border: 1.5px solid #d0d5dd; border-radius: 12px; overflow: hidden; }
    .seg label { padding: 10px 18px; cursor: pointer; font-weight: 600; }
    .seg input { position: absolute; opacity: 0; }
    .seg input:checked + span { color: var(--green-700); }
    .seg label:has(input:checked) { background: var(--green-50); }
    .seg label:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: -3px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>Questions</h1><p id="sub">Build the questions and answer keys for an assessment.</p></div><div class="row"><button class="btn ghost" id="importBtn"></button><button class="btn primary" id="addBtn"></button></div></div>
    <div class="toolbar"><select class="input" id="pick" aria-label="Assessment"></select><button class="btn ghost sm" id="healthBtn"></button></div>
    <div id="health"></div>
    <div id="list"><div class="card skeleton" style="height:120px"></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/grading.js"></script>
  <script src="../shared/admin.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireAdmin();
      DBI.adminShell('questions', me);
      var esc = DBI.esc, icon = DBI.icon, G = window.DBIGrading;
      var FV = firebase.firestore.FieldValue;
      var TYPE_NAMES = {
        'multiple-choice': 'Multiple choice (one answer)', 'multiple-select': 'Multiple select (several answers)', 'true-false': 'True or false',
        'fill-blank': 'Fill in the blank', 'short-answer': 'Short answer', numeric: 'Number answer', matching: 'Matching', ordering: 'Put in order',
        essay: 'Essay / written answer', code: 'Coding', 'file-upload': 'File upload',
      };
      var LANGS = ['javascript', 'python', 'html', 'css', 'java', 'c', 'cpp', 'php', 'sql', 'other'];
      var assessments = [], current = null, rows = [];

      document.getElementById('addBtn').innerHTML = icon('plus') + 'Add question';
      document.getElementById('importBtn').innerHTML = icon('upload') + 'Import';
      document.getElementById('healthBtn').innerHTML = icon('shield') + 'Check answer keys';

      function rid(p) { return (p || 'o') + Math.random().toString(36).slice(2, 8); }
      function lines(s) { return String(s || '').split(/\n|\|/).map(function (x) { return x.trim(); }).filter(Boolean); }
      function letter(i) { return String.fromCharCode(65 + i); }

      // ---------------------------------------------------------------- loading
      async function init() {
        assessments = await DBI.loadAssessments();
        var pick = document.getElementById('pick');
        if (!assessments.length) {
          document.getElementById('list').innerHTML = '<div class="card empty">' + icon('list') + '<p>Create an assessment first.</p><a class="btn primary" href="assessments.html">Go to assessments</a></div>';
          pick.hidden = true;
          return;
        }
        var want = new URLSearchParams(location.search).get('a');
        pick.innerHTML = assessments.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === want ? ' selected' : '') + '>' + esc(a.title || 'Untitled') + (a.status === 'published' ? ' (published)' : '') + '</option>'; }).join('');
        pick.onchange = function () {
          history.replaceState(null, '', '?a=' + encodeURIComponent(pick.value));
          load();
        };
        load();
      }

      async function load() {
        current = assessments.filter(function (a) { return a.id === document.getElementById('pick').value; })[0];
        var snap = await DBI.db.collection('questions').where('assessmentId', '==', current.id).get();
        var docs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (d) { return !d.archived; });
        var keys = await Promise.all(docs.map(function (d) { return DBI.db.collection('questionKeys').doc(d.id).get(); }));
        rows = docs.map(function (d, i) {
          var k = keys[i].exists ? keys[i].data() : null;
          var n = G.normalizeQuestion(d, k);
          n.question.id = d.id;
          var legacy = !k || d.version !== 2;
          if (d.keyCheck === 'true-false-default') n.warnings.push('Upgraded from the old builder, which saved “False” by default. Confirm the answer.');
          return { doc: d, keyDoc: k, q: n.question, key: n.key, warnings: n.warnings, legacy: legacy };
        });
        rows.sort(function (a, b) {
          var oa = Number(a.doc.order), ob = Number(b.doc.order);
          if (isNaN(oa)) oa = 1e9;
          if (isNaN(ob)) ob = 1e9;
          return oa - ob || String(a.doc.createdAt && a.doc.createdAt.seconds || 0).localeCompare(String(b.doc.createdAt && b.doc.createdAt.seconds || 0));
        });
        if (Number(current.totalQuestions) !== rows.length) {
          current.totalQuestions = rows.length;
          DBI.db.collection('assessments').doc(current.id).update({ totalQuestions: rows.length }).catch(function () {});
        }
        draw();
      }

      function keySummary(r) {
        var q = r.q, k = r.key;
        var ok = function (t) { return '<span class="ok">' + esc(t) + '</span>'; };
        switch (q.type) {
          case 'multiple-choice':
          case 'multiple-select':
            return 'Answer: ' + (k.correct || []).map(function (id) {
              var i = q.options.map(function (o) { return o.id; }).indexOf(id);
              return i === -1 ? '' : ok(letter(i) + '. ' + q.options[i].text);
            }).filter(Boolean).join(', ');
          case 'true-false':
            return k.correct === true || k.correct === false ? 'Answer: ' + ok(k.correct ? 'True' : 'False') : '';
          case 'fill-blank':
            return (k.blanks || []).map(function (b, i) { return 'Blank ' + (i + 1) + ': ' + ok((b.accepted || []).join(' / ')); }).join(' · ');
          case 'short-answer':
            return k.manual ? 'Marked by a teacher' : (k.match === 'keywords' ? 'Keywords: ' : 'Accepts: ') + ok((k.accepted || []).join(' / ')) + (k.reviewIfWrong ? ' · wrong answers go to a teacher' : '');
          case 'numeric':
            return k.min !== undefined || k.max !== undefined ? 'Between ' + ok(k.min + ' and ' + k.max) : 'Answer: ' + ok(String(k.value) + (q.unit ? ' ' + q.unit : '')) + (Number(k.tolerance) ? ' ± ' + k.tolerance : '');
          case 'matching':
            return (q.prompts || []).map(function (p) {
              var c = (q.choices || []).filter(function (c) { return c.id === (k.pairs || {})[p.id]; })[0];
              return esc(p.text) + ' → ' + ok(c ? c.text : '?');
            }).join(' · ');
          case 'ordering':
            return 'Order: ' + (k.order || []).map(function (id) { var it = (q.items || []).filter(function (x) { return x.id === id; })[0]; return it ? ok(it.text) : '?'; }).join(' → ');
          default:
            return 'Marked by a teacher' + (k.rubric ? ' · rubric set' : '');
        }
      }

      function draw() {
        var total = rows.reduce(function (s, r) { return s + r.q.points; }, 0);
        var issues = rows.filter(function (r) { return r.warnings.length || r.legacy; }).length;
        document.getElementById('sub').innerHTML = esc(rows.length) + ' question' + (rows.length === 1 ? '' : 's') + ' · ' + esc(total) + ' marks' + (current.poolSize ? ' · each student gets ' + esc(current.poolSize) : '') + (current.status === 'published' ? ' · <span class="badge green">Published</span>' : '');
        document.getElementById('health').innerHTML = issues ? '<div class="alert warn" style="margin-bottom:14px">' + icon('alert') + '<span><b>' + issues + ' question' + (issues === 1 ? ' needs' : 's need') + ' checking.</b> Old-format questions or missing answers can be marked wrongly. <a href="#" id="fixAll">Check and upgrade now</a>.</span></div>' : '';
        var fix = document.getElementById('fixAll');
        if (fix) fix.onclick = function (e) { e.preventDefault(); health(); };
        var list = document.getElementById('list');
        if (!rows.length) {
          list.innerHTML = '<div class="card empty">' + icon('help') + '<p>No questions yet.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="add">' + icon('plus') + 'Add the first question</button><button class="btn ghost" data-act="import">' + icon('upload') + 'Import questions</button></div></div>';
          return;
        }
        list.innerHTML = rows.map(function (r, i) {
          var warn = r.warnings.length ? '<div class="alert warn small" style="margin-top:8px">' + icon('alert') + '<span>' + esc(r.warnings.join(' ')) + '</span></div>' : r.legacy ? '<div class="small muted" style="margin-top:6px">' + icon('refresh') + ' Old format — open and save, or use “Check answer keys”, to upgrade.</div>' : '';
          return '<article class="card qcard-admin"><span class="qrow"><span class="qn">' + (i + 1) + '</span></span><div class="body">' +
            '<div class="row small"><span class="badge blue">' + esc(TYPE_NAMES[r.q.type] || r.q.type) + '</span><span class="muted">' + esc(r.q.points) + ' mark' + (r.q.points === 1 ? '' : 's') + '</span>' + (r.q.imageUrl ? '<span class="muted">' + icon('eye') + ' image</span>' : '') + '</div>' +
            '<div class="qtext">' + DBI.rich(r.q.text.length > 300 ? r.q.text.slice(0, 300) + '…' : r.q.text) + '</div><div class="key">' + keySummary(r) + '</div>' + warn + '</div>' +
            '<div class="acts"><button class="btn ghost sm" data-act="edit" data-i="' + i + '" aria-label="Edit question ' + (i + 1) + '">' + icon('edit') + '</button>' +
            '<button class="btn ghost sm" data-act="up" data-i="' + i + '" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>' + icon('up') + '</button>' +
            '<button class="btn ghost sm" data-act="down" data-i="' + i + '" aria-label="Move down"' + (i === rows.length - 1 ? ' disabled' : '') + '>' + icon('down') + '</button>' +
            '<button class="btn ghost sm" data-act="copy" data-i="' + i + '" aria-label="Duplicate">' + icon('copy') + '</button>' +
            '<button class="btn ghost sm" data-act="del" data-i="' + i + '" aria-label="Delete">' + icon('trash') + '</button></div></article>';
        }).join('');
      }

      document.getElementById('addBtn').onclick = function () { editor(null); };
      document.getElementById('importBtn').onclick = function () { importer(); };
      document.getElementById('healthBtn').onclick = function () { health(); };
      document.getElementById('list').addEventListener('click', async function (e) {
        var b = e.target.closest('[data-act]');
        if (!b) return;
        var i = Number(b.dataset.i), r = rows[i];
        if (b.dataset.act === 'add') return editor(null);
        if (b.dataset.act === 'import') return importer();
        if (b.dataset.act === 'edit') return editor(r);
        if (b.dataset.act === 'up' || b.dataset.act === 'down') {
          var j = b.dataset.act === 'up' ? i - 1 : i + 1;
          var t = rows[i];
          rows[i] = rows[j];
          rows[j] = t;
          draw();
          await saveOrder();
        }
        if (b.dataset.act === 'copy') {
          var docs = toDocs(r.q, r.key);
          await saveQuestion(null, docs.question, docs.key, i + 1);
          DBI.toast('Duplicated', 'ok');
        }
        if (b.dataset.act === 'del') {
          if (!(await DBI.confirm('Delete question ' + (i + 1) + '?', 'Attempts already submitted keep their saved answers, but this question will no longer count when you regrade.', 'Delete', true))) return;
          var batch = DBI.db.batch();
          batch.delete(DBI.db.collection('questions').doc(r.q.id));
          batch.delete(DBI.db.collection('questionKeys').doc(r.q.id));
          await batch.commit();
          DBI.toast('Deleted', 'ok');
          load();
        }
      });

      async function saveOrder() {
        await DBI.batchWrite(rows.map(function (r, i) {
          return function (b) { b.update(DBI.db.collection('questions').doc(r.q.id), { order: (i + 1) * 10 }); };
        }));
      }

      /** Normalized question + key → the documents stored in Firestore (the key is kept apart from the question). */
      function toDocs(q, key) {
        var doc = { type: q.type, text: q.text, points: q.points, imageUrl: q.imageUrl || '', imageAlt: q.imageAlt || '', version: 2 };
        ['options', 'prompts', 'choices', 'items', 'unit', 'language', 'starterCode', 'codeToRead', 'codeSubType', 'instructions', 'fileTypes', 'maxFileSize'].forEach(function (f) { if (q[f] !== undefined && q[f] !== '') doc[f] = q[f]; });
        if (q.maxWords) doc.maxWordCount = q.maxWords;
        var k = JSON.parse(JSON.stringify(key || {}));
        Object.keys(k).forEach(function (f) { if (k[f] === undefined) delete k[f]; });
        return { question: doc, key: k };
      }

      async function saveQuestion(id, qdoc, key, position) {
        var ref = id ? DBI.db.collection('questions').doc(id) : DBI.db.collection('questions').doc();
        var old = id ? rows.filter(function (r) { return r.q.id === id; })[0] : null;
        var data = Object.assign({}, qdoc, {
          assessmentId: current.id,
          order: old && !isNaN(Number(old.doc.order)) ? Number(old.doc.order) : (position === undefined ? rows.length + 1 : position + 0.5) * 10,
          createdAt: old && old.doc.createdAt ? old.doc.createdAt : FV.serverTimestamp(),
          updatedAt: FV.serverTimestamp(),
          updatedBy: me.user.email || me.user.uid,
        });
        var batch = DBI.db.batch();
        // set() (not update) so fields from the old format, including plain-text answers, are removed from the question.
        batch.set(ref, data);
        batch.set(DBI.db.collection('questionKeys').doc(ref.id), Object.assign({}, key, { assessmentId: current.id, updatedAt: FV.serverTimestamp() }));
        await batch.commit();
        await load();
        if (position !== undefined) await saveOrder();
        return ref.id;
      }

      // ---------------------------------------------------------------- editor
      function editor(r) {
        var q = r ? JSON.parse(JSON.stringify(r.q)) : { type: 'multiple-choice', text: '', points: 1, options: [{ id: rid(), text: '' }, { id: rid(), text: '' }, { id: rid(), text: '' }, { id: rid(), text: '' }] };
        var key = r ? JSON.parse(JSON.stringify(r.key)) : { correct: [] };
        var form = document.createElement('div');
        form.innerHTML =
          '<div class="form-grid">' +
          '<label class="field"><span>Question type</span><select class="input" id="e_type">' + Object.keys(TYPE_NAMES).map(function (t) { return '<option value="' + t + '"' + (q.type === t ? ' selected' : '') + '>' + TYPE_NAMES[t] + '</option>'; }).join('') + '</select></label>' +
          '<label class="field"><span>Marks</span><input class="input" type="number" min="0.5" step="0.5" id="e_points" value="' + esc(q.points) + '"></label>' +
          '<label class="field full"><span>Question</span><textarea class="input" id="e_text" rows="3" placeholder="Type the question. Use **bold** and `code`.">' + esc(q.text) + '</textarea><span class="hint" id="e_texthint"></span></label>' +
          '</div>' +
          '<details' + (q.imageUrl ? ' open' : '') + '><summary class="small" style="cursor:pointer;font-weight:700">Picture (optional)</summary><div class="form-grid" style="margin-top:8px">' +
          '<label class="field"><span>Upload a picture</span><input class="input" type="file" accept="image/*" id="e_file"></label>' +
          '<label class="field"><span>…or picture link</span><input class="input" id="e_img" value="' + esc(q.imageUrl || '') + '" placeholder="https://"></label>' +
          '<label class="field full"><span>Describe the picture (for screen readers and slow networks)</span><input class="input" id="e_alt" value="' + esc(q.imageAlt || '') + '"></label></div><div id="e_thumb"></div></details>' +
          '<div id="e_type_area" style="margin-top:14px"></div>' +
          '<label class="field" style="margin-top:12px"><span>Explanation shown after marking (optional)</span><textarea class="input" id="e_expl" rows="2">' + esc(key.explanation || '') + '</textarea></label>' +
          '<div class="try" id="e_try"></div>';
        var area = form.querySelector('#e_type_area');

        function thumb() {
          var u = form.querySelector('#e_img').value.trim();
          form.querySelector('#e_thumb').innerHTML = /^https:\/\//.test(u) ? '<img class="thumb" src="' + esc(u) + '" alt="">' : '';
        }
        thumb();
        form.querySelector('#e_img').addEventListener('change', thumb);
        form.querySelector('#e_file').addEventListener('change', async function (e) {
          var f = e.target.files[0];
          if (!f) return;
          form.querySelector('#e_thumb').innerHTML = '<p class="small muted"><span class="spin"></span> Uploading…</p>';
          try {
            form.querySelector('#e_img').value = await DBI.uploadMedia(f);
            DBI.toast('Picture uploaded', 'ok');
          } catch (err) {
            DBI.toast(err.message, 'error');
          }
          thumb();
        });

        /** Reads the current form into { q, key }. */
        function collect() {
          var out = { type: form.querySelector('#e_type').value, text: form.querySelector('#e_text').value.trim(), points: Math.max(0.5, Number(form.querySelector('#e_points').value) || 1), imageUrl: form.querySelector('#e_img').value.trim(), imageAlt: form.querySelector('#e_alt').value.trim() };
          var k = {};
          var expl = form.querySelector('#e_expl').value.trim();
          if (expl) k.explanation = expl;
          var $ = function (s) { return area.querySelector(s); };
          var $$ = function (s) { return Array.prototype.slice.call(area.querySelectorAll(s)); };
          switch (out.type) {
            case 'multiple-choice':
            case 'multiple-select':
              out.options = $$('.opt-row').map(function (row) { return { id: row.dataset.id, text: row.querySelector('.input').value.trim() }; }).filter(function (o) { return o.text; });
              k.correct = $$('.opt-row').filter(function (row) { return row.querySelector('input[name=correct]').checked && row.querySelector('.input').value.trim(); }).map(function (row) { return row.dataset.id; });
              break;
            case 'true-false': {
              var v = area.querySelector('input[name=tf]:checked');
              k.correct = v ? v.value === 'true' : null;
              break;
            }
            case 'fill-blank':
              k.blanks = $$('.blank-key').map(function (t) { return { accepted: lines(t.value) }; });
              k.caseSensitive = $('#k_case').checked;
              k.fuzzy = $('#k_fuzzy').checked;
              break;
            case 'short-answer': {
              var mode = $('#k_mode').value;
              if (mode === 'manual') k.manual = true;
              else {
                k.accepted = lines($('#k_acc').value);
                if (mode === 'keywords') {
                  k.match = 'keywords';
                  k.minKeywords = Math.max(1, Number($('#k_minkw').value) || k.accepted.length);
                }
                k.caseSensitive = $('#k_case').checked;
                k.fuzzy = $('#k_fuzzy').checked;
                k.reviewIfWrong = $('#k_review').checked;
              }
              out.maxWords = Number($('#k_words').value) || 0;
              break;
            }
            case 'numeric':
              out.unit = $('#k_unit').value.trim();
              if ($('#k_range').checked) {
                k.min = G.parseNumber($('#k_min').value);
                k.max = G.parseNumber($('#k_max').value);
              } else {
                k.value = G.parseNumber($('#k_val').value);
                k.tolerance = Math.abs(G.parseNumber($('#k_tol').value)) || 0;
              }
              Object.keys(k).forEach(function (f) { if (typeof k[f] === 'number' && isNaN(k[f])) delete k[f]; });
              break;
            case 'matching':
              out.prompts = [];
              out.choices = [];
              k.pairs = {};
              $$('.pair-row').forEach(function (row) {
                var l = row.querySelector('.left').value.trim(), rt = row.querySelector('.right').value.trim();
                if (!l || !rt) return;
                out.prompts.push({ id: row.dataset.p, text: l });
                out.choices.push({ id: row.dataset.c, text: rt });
                k.pairs[row.dataset.p] = row.dataset.c;
              });
              lines($('#k_extra').value.replace(/\|/g, '\n')).forEach(function (t, i) { out.choices.push({ id: 'x' + (i + 1), text: t }); });
              break;
            case 'ordering':
              out.items = $$('.item-row').map(function (row) { return { id: row.dataset.id, text: row.querySelector('.input').value.trim() }; }).filter(function (x) { return x.text; });
              k.order = out.items.map(function (x) { return x.id; });
              break;
            case 'essay':
              out.maxWords = Number($('#k_words').value) || 0;
              k.rubric = $('#k_rubric').value.trim();
              k.sampleAnswer = $('#k_sample').value.trim();
              break;
            case 'code':
              out.language = $('#k_lang').value;
              out.codeSubType = $('#k_sub').value;
              out.instructions = $('#k_inst').value.trim();
              out.starterCode = $('#k_starter').value;
              out.codeToRead = $('#k_read').value;
              k.rubric = $('#k_rubric').value.trim();
              k.sampleAnswer = $('#k_sample').value;
              break;
            case 'file-upload':
              out.fileTypes = $('#k_ftypes').value;
              out.maxFileSize = Math.max(1, Math.min(20, Number($('#k_fsize').value) || 5));
              k.rubric = $('#k_rubric').value.trim();
              break;
          }
          if (['multiple-select', 'matching', 'ordering', 'fill-blank'].indexOf(out.type) !== -1 && area.querySelector('#k_partial')) k.partialCredit = area.querySelector('#k_partial').checked;
          return { q: out, key: k };
        }

        function partialSwitch() {
          return '<div class="switch-row"><div><b>Partial credit</b><small>Give marks for each correct part (if the assessment allows it).</small></div><label class="switch"><input type="checkbox" id="k_partial"' + (key.partialCredit !== false ? ' checked' : '') + ' aria-label="Partial credit"><span></span></label></div>';
        }
        function check(id, label, on) {
          return '<label class="check" style="margin:8px 0"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span>' + label + '</span></label>';
        }

        function renderType() {
          var t = form.querySelector('#e_type').value;
          var multi = t === 'multiple-select';
          var hint = form.querySelector('#e_texthint');
          hint.textContent = t === 'fill-blank' ? 'Write ____ (4 underscores) where each blank goes, e.g. “HTML stands for ____ Markup Language.”' : '';
          var h = '';
          if (t === 'multiple-choice' || t === 'multiple-select') {

          if ((t === 'multiple-choice' || t === 'multiple-select') && !c.key.correct.length) return DBI.toast('Tick the correct answer.', 'error'), false;

      // ---------------------------------------------------------------- answer-key health and upgrade
      async function health() {
        var bad = rows.filter(function (r) { return r.warnings.length || r.legacy; });

        var tf = bad.filter(function (r) { return r.q.type === 'true-false' && r.legacy; });

          '<div class="table-wrap" style="max-height:320px"><table class="table"><thead><tr><th>#</th><th>Question</th><th>Answer found</th><th>Notes</th></tr></thead><tbody>' + bad.map(function (r) {
            return '<tr><td>' + (rows.indexOf(r) + 1) + '</td><td class="small">' + esc(r.q.text.slice(0, 90)) + '</td><td class="small">' + keySummary(r) + '</td><td class="small">' + (r.warnings.length ? '<span class="badge amber">' + esc(r.warnings.join(' ')) + '</span>' : '<span class="badge green">Ready</span>') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          (tf.length ? '<p class="alert warn small" style="margin-top:10px">' + icon('alert') + '<span>' + tf.length + ' true/false question' + (tf.length > 1 ? 's were' : ' was') + ' made with the old builder, which saved “False” whenever no answer was picked. They will be marked “Confirm answer” until you open and save each one.</span></p>' : '');
        var v = await DBI.modal({ title: 'Check answer keys', wide: true, body: body, actions: [{ label: 'Close', value: null }, { label: 'Upgrade ' + bad.filter(function (r) { return r.legacy; }).length + ' question(s)', value: true, kind: 'primary' }] });
        if (!v) return;
        var ops = [];
        bad.filter(function (r) { return r.legacy; }).forEach(function (r) {
          var docs = toDocs(r.q, r.key);
          var qd = Object.assign({}, docs.question, { assessmentId: current.id, order: isNaN(Number(r.doc.order)) ? (rows.indexOf(r) + 1) * 10 : Number(r.doc.order), createdAt: r.doc.createdAt || FV.serverTimestamp(), updatedAt: FV.serverTimestamp(), upgradedAt: FV.serverTimestamp() });
          if (r.q.type === 'true-false') qd.keyCheck = 'true-false-default';

      // ---------------------------------------------------------------- import
      /** Aiken format: question, options "A. …", then "ANSWER: B". Blank line between questions. */
      function parseAiken(text) {
        var out = [];
        text.replace(/\r/g, '').split(/\n\s*\n/).forEach(function (block) {
          var ls = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
          if (!ls.length) return;
          var qText = [], options = [], answer = null;
          ls.forEach(function (l) {
            var m;
            if ((m = l.match(/^ANSWER\s*[:=]\s*(.+)$/i))) answer = m[1].trim();
            else if ((m = l.match(/^([A-Ha-h])[.)]\s+(.*)$/))) options.push(m[2]);
            else qText.push(l);
          });
          if (!qText.length) return;
          var letters = answer ? answer.split(/[\s,]+/).filter(Boolean) : [];
          var type = !options.length ? 'short-answer' : letters.length > 1 ? 'multiple-select' : 'multiple-choice';
          if (options.length === 2 && /^true$/i.test(options[0]) && /^false$/i.test(options[1])) {
            out.push({ type: 'true-false', text: qText.join('\n'), correctAnswer: letters[0] && letters[0].toUpperCase() === 'A' ? 'True' : letters[0] ? 'False' : null });
            return;
          }
          out.push({ type: type, text: qText.join('\n'), options: options, correctAnswers: letters });
        });
        return out;
      }
      function parseCsv(text) {
        var rowsOut = [], row = [], cell = '', inQ = false;
        text = text.replace(/^﻿/, '');
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (inQ) {
            if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
            else if (ch === '"') inQ = false;
            else cell += ch;
          } else if (ch === '"') inQ = true;
          else if (ch === ',') { row.push(cell); cell = ''; }
          else if (ch === '\n' || ch === '\r') {
            if (ch === '\r' && text[i + 1] === '\n') i++;
            row.push(cell); rowsOut.push(row); row = []; cell = '';
          } else cell += ch;
        }
        if (cell || row.length) { row.push(cell); rowsOut.push(row); }
        rowsOut = rowsOut.filter(function (r) { return r.some(function (c) { return c.trim(); }); });
        if (!rowsOut.length) return [];
        var head = rowsOut[0].map(function (h) { return h.trim().toLowerCase(); });
        var idx = function (n) { return head.indexOf(n); };
        return rowsOut.slice(1).map(function (r) {
          var get = function (n) { var i = idx(n); return i === -1 ? '' : (r[i] || '').trim(); };
          var options = head.map(function (h, i) { return /^option\s*\d+$|^[a-h]$/.test(h) ? (r[i] || '').trim() : ''; }).filter(Boolean);
          var type = (get('type') || (options.length ? 'multiple-choice' : 'short-answer')).toLowerCase();
          var ans = get('answer') || get('correct') || get('correct answer');
          var d = { type: type, text: get('question') || get('text'), points: Number(get('points') || get('marks')) || 1, explanation: get('explanation') };
          if (options.length) d.options = options;
          if (type === 'multiple-select' || type === 'fill-blank') d.correctAnswers = ans.split(type === 'fill-blank' ? /;/ : /[;,]/).map(function (s) { return s.trim(); }).filter(Boolean);
          else if (type === 'short-answer') d.correctAnswers = ans ? ans.split('|').map(function (s) { return s.trim(); }) : [];
          else d.correctAnswer = ans;
          if (type === 'ordering' && options.length) d.items = options;
          return d;
        });
      }
      function fromLegacy(d) {
        var n = G.normalizeQuestion(d, d.key || null);
        if (!n.question.text) n.warnings.push('Missing question text.');
        var docs = toDocs(n.question, n.key);
        if (d.explanation) docs.key.explanation = d.explanation;
        return { question: docs.question, key: docs.key, warnings: n.warnings, text: n.question.text, type: n.question.type };
      }

      async function importer() {
        var others = assessments.filter(function (a) { return a.id !== current.id; });
        var form = document.createElement('div');
        form.innerHTML =
          '<div class="tabbar" role="tablist"><button type="button" role="tab" data-tab="text" aria-selected="true">Paste text</button><button type="button" role="tab" data-tab="file" aria-selected="false">CSV / JSON file</button><button type="button" role="tab" data-tab="copy" aria-selected="false">From another assessment</button></div>' +
          '<section data-pane="text"><p class="small muted">Paste questions in this format, with an empty line between questions:</p><pre class="code small" style="white-space:pre-wrap">Which device is used to type?\nA. Monitor\nB. Keyboard\nC. Speaker\nANSWER: B</pre><textarea class="input" id="i_text" rows="8" placeholder="Paste here"></textarea></section>' +
          '<section data-pane="file" hidden><p class="small muted">CSV columns: <code>type, question, points, option1 … option6, answer, explanation</code>. The answer can be the letter (B), the option text, or several separated by ; for multiple select. JSON: a list of question objects.</p><input class="input" type="file" id="i_file" accept=".csv,.json,text/csv,application/json"><button type="button" class="btn ghost sm" id="i_tpl" style="margin-top:8px">' + icon('download') + 'Download CSV template</button></section>' +
          '<section data-pane="copy" hidden>' + (others.length ? '<label class="field"><span>Copy all questions from</span><select class="input" id="i_from">' + others.map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.title || 'Untitled') + '</option>'; }).join('') + '</select></label>' : '<p class="muted">There are no other assessments.</p>') + '</section>' +
          '<div id="i_prev" style="margin-top:12px"></div>';
        var parsed = [], mode = 'text';
        function preview() {
          var box = form.querySelector('#i_prev');
          if (!parsed.length) return (box.innerHTML = '');
          var warn = parsed.filter(function (p) { return p.warnings.length; });
          box.innerHTML = '<p><b>' + parsed.length + ' question' + (parsed.length === 1 ? '' : 's') + ' found.</b>' + (warn.length ? ' <span class="badge amber">' + warn.length + ' need checking</span>' : ' <span class="badge green">All keys found</span>') + '</p>' +
            (warn.length ? '<ul class="small">' + warn.slice(0, 10).map(function (p) { return '<li>' + esc(p.text.slice(0, 70)) + ': ' + esc(p.warnings.join(' ')) + '</li>'; }).join('') + '</ul>' : '');
        }
        form.addEventListener('click', async function (e) {
          var t = e.target.closest('[data-tab]');
          if (t) {
            mode = t.dataset.tab;
            form.querySelectorAll('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', x === t); });
            form.querySelectorAll('[data-pane]').forEach(function (p) { p.hidden = p.dataset.pane !== mode; });
            parsed = [];
            preview();
          }
          if (e.target.closest('#i_tpl')) DBI.downloadCsv('dbi-questions-template.csv', [['type', 'question', 'points', 'option1', 'option2', 'option3', 'option4', 'answer', 'explanation'], ['multiple-choice', 'Which device is used to type?', '1', 'Monitor', 'Keyboard', 'Speaker', 'Printer', 'B', 'You type with a keyboard.'], ['true-false', 'A mouse is an input device.', '1', '', '', '', '', 'True', ''], ['fill-blank', 'HTML stands for ____ Markup Language.', '1', '', '', '', '', 'HyperText', ''], ['short-answer', 'Name the brain of the computer.', '1', '', '', '', '', 'CPU|Central Processing Unit', '']]);
        });
        form.addEventListener('input', function (e) {
          if (e.target.id === 'i_text') {
            parsed = parseAiken(e.target.value).map(fromLegacy);
            preview();
          }
        });
        form.addEventListener('change', async function (e) {
          if (e.target.id === 'i_file' && e.target.files[0]) {
            var text = await e.target.files[0].text();
            try {
              var list = /\.json$/i.test(e.target.files[0].name) ? JSON.parse(text) : parseCsv(text);
              if (!Array.isArray(list)) list = list.questions || [];
              parsed = list.map(fromLegacy);
            } catch (err) {
              DBI.toast('Could not read the file: ' + err.message, 'error');
              parsed = [];
            }
            preview();
          }
        });
        var v = await DBI.modal({ title: 'Import questions', wide: true, body: form, actions: [{ label: 'Cancel', value: null }, { label: 'Import', value: true, kind: 'primary' }] });
        if (!v) return;
        var base = rows.length;
        var ops = [];
        if (mode === 'copy') {
          var from = form.querySelector('#i_from');
          if (!from) return;
          var snap = await DBI.db.collection('questions').where('assessmentId', '==', from.value).get();
          for (var i = 0; i < snap.docs.length; i++) {
            var d = snap.docs[i];
            var k = await DBI.db.collection('questionKeys').doc(d.id).get();
            var n = G.normalizeQuestion(Object.assign({ id: d.id }, d.data()), k.exists ? k.data() : null);
            var docs = toDocs(n.question, n.key);
            parsed.push({ question: docs.question, key: docs.key, warnings: n.warnings, order: Number(d.data().order) || i });
          }
          parsed.sort(function (a, b) { return a.order - b.order; });
        }
        if (!parsed.length) return DBI.toast('Nothing to import.', 'error');
        parsed.forEach(function (p, i) {
          var ref = DBI.db.collection('questions').doc();
          ops.push(function (b) { b.set(ref, Object.assign({}, p.question, { assessmentId: current.id, order: (base + i + 1) * 10, createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp(), importedBy: me.user.email || me.user.uid })); });
          ops.push(function (b) { b.set(DBI.db.collection('questionKeys').doc(ref.id), Object.assign({}, p.key, { assessmentId: current.id, updatedAt: FV.serverTimestamp() })); });
        });
        await DBI.batchWrite(ops);
        DBI.toast(parsed.length + ' questions imported', 'ok');
        load();
      }

      init().catch(function (e) { document.getElementById('list').innerHTML = '<div class="card empty"><p>' + esc(e.message) + '</p></div>'; });
    })();
  </script>
</body>
