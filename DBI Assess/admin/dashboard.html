<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — DBI Assess Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1 id="hello">Dashboard</h1><p>What needs your attention today.</p></div><a class="btn primary" href="assessments.html" id="newLink"></a></div>
    <div class="grid cols-4" id="stats" style="margin-bottom:16px"><div class="card skeleton" style="height:84px"></div><div class="card skeleton" style="height:84px"></div><div class="card skeleton" style="height:84px"></div><div class="card skeleton" style="height:84px"></div></div>
    <div class="grid cols-2">
      <section class="card"><div class="row" style="justify-content:space-between"><h2>Waiting for marking</h2><a class="small" href="results.html?view=queue">Open marking queue</a></div><div id="pending"></div></section>
      <section class="card"><div class="row" style="justify-content:space-between"><h2>Taking a test now</h2><a class="small" href="results.html?view=live">Live monitor</a></div><div id="live"></div></section>
    </div>
    <section class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h2>Recent submissions</h2><a class="small" href="results.html">All results</a></div><div id="recent"></div></section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/admin.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireAdmin();
      DBI.adminShell('dashboard', me);
      var esc = DBI.esc, icon = DBI.icon;
      var first = String((me.admin && me.admin.name) || '').split(' ')[0];
      document.getElementById('hello').textContent = first ? 'Welcome back, ' + first : 'Dashboard';
      document.getElementById('newLink').innerHTML = icon('plus') + 'New assessment';

      function stat(label, value, ic, cls) {
        return '<div class="card stat"><span class="ico ' + (cls || '') + '">' + icon(ic) + '</span><div><b>' + esc(value) + '</b><small>' + esc(label) + '</small></div></div>';
      }
      function ms(v) {
        if (!v) return 0;
        if (v.toMillis) return v.toMillis();
        var n = Date.parse(v);
        return isNaN(n) ? 0 : n;
      }

      try {
        var res = await Promise.all([
          DBI.db.collection('assessments').get(),
          DBI.db.collection('users').get(),
          DBI.db.collection('studentResults').where('status', '==', 'in-progress').get(),
          DBI.db.collection('studentResults').where('gradingStatus', '==', 'pending-review').get(),
          DBI.db.collection('studentResults').where('status', '==', 'submitted').orderBy('submittedAt', 'desc').limit(12).get(),
        ]);
        var assessments = res[0].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        var published = assessments.filter(function (a) { return a.status === 'published'; }).length;
        var live = res[2].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (r) { return Date.now() - ms(r.lastSeenAt) < 15 * 60000; });
        var pending = res[3].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (r) { return r.status === 'submitted'; });
        var recent = res[4].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        var flagged = live.filter(function (r) { return r.integrity && (r.integrity.count > 0 || r.integrity.locked); }).length;

        document.getElementById('stats').innerHTML =
          stat('Published tests', published + ' of ' + assessments.length, 'list', 'blue') +
          stat('Students', res[1].size, 'user') +
          stat('To mark', pending.length, 'edit', pending.length ? 'amber' : '') +
          stat('Taking a test now', live.length, 'play', flagged ? 'red' : 'green');

        // Group the marking queue by assessment so a teacher can mark one test at a time.
        var byA = {};
        pending.forEach(function (r) {
          var k = r.assessmentId;
          byA[k] = byA[k] || { title: r.assessmentTitle, attempts: 0, answers: 0 };
          byA[k].attempts++;
          byA[k].answers += (r.grading && r.grading.pendingCount) || 0;
        });
        var keys = Object.keys(byA);
        document.getElementById('pending').innerHTML = keys.length
          ? '<ul class="list">' + keys.map(function (k) {
              var g = byA[k];
              return '<li><a href="results.html?a=' + encodeURIComponent(k) + '&view=queue"><b>' + esc(g.title || 'Assessment') + '</b><span class="muted small">' + g.answers + ' answer' + (g.answers === 1 ? '' : 's') + ' in ' + g.attempts + ' attempt' + (g.attempts === 1 ? '' : 's') + '</span></a><span class="badge amber">Mark</span></li>';
            }).join('') + '</ul>'
          : '<p class="empty-line">' + icon('check') + ' Nothing to mark. Well done!</p>';

        document.getElementById('live').innerHTML = live.length
          ? '<ul class="list">' + live.slice(0, 8).map(function (r) {
              var n = r.integrity ? r.integrity.count : 0;
              return '<li><a href="results.html?attempt=' + encodeURIComponent(r.id) + '"><b>' + esc(r.studentName || r.studentId) + '</b><span class="muted small">' + esc(r.assessmentTitle || '') + ' · ' + Object.keys(r.answers || {}).length + '/' + esc(r.totalQuestions || '?') + ' answered</span></a>' +
                (r.integrity && r.integrity.locked ? '<span class="badge red">Paused</span>' : n ? '<span class="badge amber">' + n + ' alert' + (n > 1 ? 's' : '') + '</span>' : '<span class="badge green">OK</span>') + '</li>';
            }).join('') + '</ul>' + (live.length > 8 ? '<p class="small muted">and ' + (live.length - 8) + ' more</p>' : '')
          : '<p class="empty-line">No one is taking a test right now.</p>';

        document.getElementById('recent').innerHTML = recent.length
          ? '<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Assessment</th><th>Score</th><th>Submitted</th><th>Alerts</th></tr></thead><tbody>' + recent.map(function (r) {
              var score = r.gradingStatus === 'pending-review' ? '<span class="badge amber">To mark</span>' : '<b>' + esc(r.score) + '%</b> ' + (r.passed ? '<span class="badge green">Pass</span>' : '<span class="badge">Below pass</span>');
              var n = r.integrity ? r.integrity.count : 0;
              return '<tr><td><a href="results.html?attempt=' + encodeURIComponent(r.id) + '">' + esc(r.studentName || r.studentId) + '</a><div class="muted small">' + esc(r.studentId) + '</div></td><td>' + esc(r.assessmentTitle || '') + '</td><td>' + score + '</td><td class="small">' + esc(DBI.fmtDate(r.submittedAt, true)) + (r.offlineSubmit ? ' ' + icon('wifiOff') : '') + '</td><td>' + (n ? '<span class="badge amber">' + n + '</span>' : '—') + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : '<p class="empty-line">No submissions yet.</p>';
      } catch (e) {
        document.getElementById('stats').innerHTML = '<div class="card empty" style="grid-column:1/-1"><p>Could not load the dashboard: ' + esc(e.message) + '</p></div>';
      }
    })();
  </script>
</body>
</html>
