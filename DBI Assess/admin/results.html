<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results & marking — DBI Assess Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .ans { background: #f9fafb; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .ans.code { font-family: var(--mono); font-size: .88rem; background: #0f172a; color: #e2e8f0; }
    .item { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; margin-bottom: 12px; }
    .item.pending { border-color: #fec84b; box-shadow: 0 0 0 3px var(--amber-50); }
    .item h3 { font-size: 1rem; margin: 0 0 6px; }
    .markbox { display: grid; grid-template-columns: 120px 1fr; gap: 10px; margin-top: 10px; align-items: start; }
    .markbox .input { min-height: 44px; }
    .markbox textarea.input { min-height: 44px; }
    @media (max-width: 560px) { .markbox { grid-template-columns: 1fr; } }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .quick button { min-height: 34px; padding: 0 10px; }
    .sim { color: var(--red); font-weight: 700; }
    .opt-bar { display: grid; grid-template-columns: 28px 1fr 60px; gap: 8px; align-items: center; font-size: .88rem; margin: 3px 0; }
    .opt-bar .bar i.right { background: var(--green); }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>Results & marking</h1><p id="sub">Mark written answers, release results and spot problems.</p></div>
      <div class="row"><button class="btn ghost" id="exportBtn"></button><button class="btn ghost" id="regradeBtn"></button><button class="btn primary" id="releaseBtn"></button></div></div>
    <div class="toolbar"><select class="input" id="pick" aria-label="Assessment"></select></div>
    <div class="tabbar" role="tablist" id="tabs">
      <button role="tab" data-view="results" aria-selected="true">Results</button>
      <button role="tab" data-view="queue" aria-selected="false">Marking queue <span class="badge amber" id="qCount" hidden></span></button>
      <button role="tab" data-view="analysis" aria-selected="false">Question analysis</button>
      <button role="tab" data-view="live" aria-selected="false">Live <span class="dot live" id="liveDot" hidden></span></button>
    </div>
    <div id="view"><div class="card skeleton" style="height:160px"></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/grading.js"></script>
  <script src="../shared/integrity.js"></script>
  <script src="../shared/admin.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireAdmin();
      DBI.adminShell('results', me);
      var esc = DBI.esc, icon = DBI.icon, G = window.DBIGrading, LABELS = window.DBIIntegrity.LABELS;
      var params = new URLSearchParams(location.search);
      var view = params.get('view') || 'results';
      var assessments = [], current = null, attempts = [], questions = [], keys = {}, unsubLive = null;
      var filter = { term: '', status: '' };

      document.getElementById('exportBtn').innerHTML = icon('download') + 'Export CSV';
      document.getElementById('regradeBtn').innerHTML = icon('refresh') + 'Regrade all';
      document.getElementById('releaseBtn').innerHTML = icon('eye') + 'Release results';

      function ms(v) {
        if (!v) return 0;
        if (v.toMillis) return v.toMillis();
        var n = Date.parse(v);
        return isNaN(n) ? 0 : n;
      }
      function pct(n) { return Math.round(n * 100) + '%'; }
      function qById(id) { return questions.filter(function (q) { return q.id === id; })[0]; }
      function nameOf(a) { return a.studentName || ((a.studentFirstName || '') + ' ' + (a.studentLastName || '')).trim() || a.studentId || 'Student'; }
      function isPending(a) { return a.status === 'submitted' && a.gradingStatus === 'pending-review'; }
      function flagged(a) { return a.integrity && (a.integrity.count > 0 || a.integrity.locked); }

      // ---------------------------------------------------------------- loading
      async function init() {
        assessments = await DBI.loadAssessments();
        var pick = document.getElementById('pick');
        if (!assessments.length) {
          document.getElementById('view').innerHTML = '<div class="card empty">' + icon('chart') + '<p>No assessments yet.</p></div>';
          return;
        }
        var want = params.get('a');
        var openAttempt = params.get('attempt');
        if (!want && openAttempt) {
          var s = await DBI.db.collection('studentResults').doc(openAttempt).get();
          if (s.exists) want = s.data().assessmentId;
        }
        if (!want) {
          var p = await DBI.db.collection('studentResults').where('gradingStatus', '==', 'pending-review').limit(1).get();
          want = p.empty ? assessments[0].id : p.docs[0].data().assessmentId;
        }
        pick.innerHTML = assessments.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === want ? ' selected' : '') + '>' + esc(a.title || 'Untitled') + '</option>'; }).join('');
        pick.onchange = function () { setParam('a', pick.value); load(); };
        await load();
        if (openAttempt) openPanel(openAttempt);
      }
      function setParam(k, v) {
        var p = new URLSearchParams(location.search);
        if (v) p.set(k, v);
        else p.delete(k);
        history.replaceState(null, '', '?' + p.toString());
      }

      async function load() {
        current = assessments.filter(function (a) { return a.id === document.getElementById('pick').value; })[0];
        var res = await Promise.all([
          DBI.db.collection('studentResults').where('assessmentId', '==', current.id).get(),
          DBI.db.collection('questions').where('assessmentId', '==', current.id).get(),
        ]);
        attempts = res[0].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return ms(b.submittedAt || b.startedAt) - ms(a.submittedAt || a.startedAt); });
        var qdocs = res[1].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
        var kd = await Promise.all(qdocs.map(function (d) { return DBI.db.collection('questionKeys').doc(d.id).get(); }));
        questions = [];
        keys = {};
        qdocs.forEach(function (d, i) {
          var n = G.normalizeQuestion(d, kd[i].exists ? kd[i].data() : null);
          n.question.id = d.id;
          n.question.archived = !!d.archived;
          questions.push(n.question);
          keys[d.id] = n.key;
        });
        var pend = attempts.filter(isPending).reduce(function (s, a) { return s + ((a.grading && a.grading.pendingCount) || 0); }, 0);
        var qc = document.getElementById('qCount');
        qc.hidden = !pend;
        qc.textContent = pend;
        var subs = attempts.filter(function (a) { return a.status === 'submitted'; });
        var graded = subs.filter(function (a) { return a.gradingStatus !== 'pending-review'; });
        var avg = graded.length ? Math.round(graded.reduce(function (s, a) { return s + (Number(a.score) || 0); }, 0) / graded.length) : null;
        document.getElementById('sub').textContent = subs.length + ' submitted · ' + attempts.filter(function (a) { return a.status === 'in-progress'; }).length + ' in progress' + (avg !== null ? ' · average ' + avg + '%' : '') + (pend ? ' · ' + pend + ' answers to mark' : '');
        show(view);
      }

      document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-view]');
        if (b) show(b.dataset.view);
      });
      function show(v) {
        view = v;
        setParam('view', v === 'results' ? '' : v);
        document.querySelectorAll('#tabs [data-view]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.view === v); });
        if (unsubLive && v !== 'live') {
          unsubLive();
          unsubLive = null;
          document.getElementById('liveDot').hidden = true;
        }
        if (v === 'results') drawResults();
        if (v === 'queue') drawQueue();
        if (v === 'analysis') drawAnalysis();
        if (v === 'live') drawLive();
      }

      // ---------------------------------------------------------------- results table
      function scoreCell(a) {
        if (a.status === 'in-progress') return '<span class="badge blue">In progress</span>';
        if (a.status === 'void') return '<span class="badge">Void</span>';
        if (isPending(a)) return '<span class="badge amber">To mark (' + ((a.grading && a.grading.pendingCount) || '?') + ')</span>';
        return '<b>' + esc(a.score) + '%</b> ' + (a.passed ? '<span class="badge green">Pass</span>' : '<span class="badge red">Below pass</span>');
      }
      function drawResults() {
        var box = document.getElementById('view');
        var rows = attempts.filter(function (a) {
          var t = filter.term;
          if (t && (nameOf(a) + ' ' + (a.studentId || '')).toLowerCase().indexOf(t) === -1) return false;
          if (filter.status === 'mark') return isPending(a);
          if (filter.status === 'flagged') return flagged(a);
          if (filter.status === 'unreleased') return a.status === 'submitted' && !a.released;
          if (filter.status === 'progress') return a.status === 'in-progress';
          return true;
        });
        box.innerHTML = '<div class="toolbar"><input class="input" id="term" type="search" placeholder="Search student name or ID" value="' + esc(filter.term) + '">' +
          '<select class="input" id="sf" style="max-width:220px">' + [['', 'All attempts'], ['mark', 'Needs marking'], ['flagged', 'Integrity alerts'], ['unreleased', 'Not yet released'], ['progress', 'In progress']].map(function (o) { return '<option value="' + o[0] + '"' + (filter.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
          (rows.length ? '<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Score</th><th>Released</th><th>Alerts</th><th>Submitted</th><th>Time</th></tr></thead><tbody>' + rows.map(function (a) {
            var n = a.integrity ? a.integrity.count : 0;
            return '<tr data-open="' + esc(a.id) + '" style="cursor:pointer"><td><a href="#" data-open="' + esc(a.id) + '"><b>' + esc(nameOf(a)) + '</b></a><div class="muted small">' + esc(a.studentId || '') + (a.attemptNumber > 1 ? ' · attempt ' + esc(a.attemptNumber) : '') + (a.version !== 2 ? ' · old system' : '') + '</div></td>' +
              '<td>' + scoreCell(a) + '</td><td>' + (a.status === 'submitted' ? (a.released ? icon('check') + '<span class="sr-only">Yes</span>' : '<span class="muted small">No</span>') : '—') + '</td>' +
              '<td>' + (a.integrity && a.integrity.locked ? '<span class="badge red">Paused</span>' : n ? '<span class="badge amber">' + n + '</span>' : '—') + '</td>' +
              '<td class="small">' + esc(DBI.fmtDate(a.submittedAt, true)) + (a.offlineSubmit ? ' <span title="Submitted offline, uploaded later">' + icon('wifiOff') + '</span>' : '') + (a.submitReason && a.submitReason !== 'student' ? '<div class="muted">' + esc({ timeout: 'Time ran out', integrity: 'Auto-submitted (alerts)', admin: 'Submitted by admin' }[a.submitReason] || a.submitReason) + '</div>' : '') + '</td>' +
              '<td class="small">' + (a.timeTaken ? esc(DBI.fmtDuration(a.timeTaken)) : '—') + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="card empty">' + icon('chart') + '<p>' + (attempts.length ? 'No attempts match.' : 'No one has taken this assessment yet.') + '</p></div>');
        box.querySelector('#term').addEventListener('input', function (e) {
          filter.term = e.target.value.trim().toLowerCase();
          var pos = e.target.selectionStart;
          drawResults();
          var t = document.getElementById('term');
          t.focus();
          t.setSelectionRange(pos, pos);
        });
        box.querySelector('#sf').addEventListener('change', function (e) { filter.status = e.target.value; drawResults(); });
      }
      document.getElementById('view').addEventListener('click', function (e) {
        var o = e.target.closest('[data-open]');
        if (o && view !== 'queue') {
          e.preventDefault();
          openPanel(o.dataset.open);
        }
      });

      // ---------------------------------------------------------------- answer display
      function fmtAnswer(q, a) {
        if (G.isBlank(a)) return '<span class="muted">No answer</span>';
        var opt = function (id) {
          var i = (q.options || []).map(function (o) { return o.id; }).indexOf(id);
          return i === -1 ? esc(id) : String.fromCharCode(65 + i) + '. ' + esc(q.options[i].text);
        };
        switch (q.type) {
          case 'multiple-choice':
          case 'multiple-select':
            return [].concat(a).map(opt).join('<br>');
          case 'true-false':
            return a === true || a === 'true' ? 'True' : 'False';
          case 'fill-blank':
            return [].concat(a).map(function (x, i) { return 'Blank ' + (i + 1) + ': <b>' + esc(x) + '</b>'; }).join('<br>');
          case 'matching':
            return (q.prompts || []).map(function (p) {
              var c = (q.choices || []).filter(function (c) { return c.id === a[p.id]; })[0];
              return esc(p.text) + ' → <b>' + esc(c ? c.text : '—') + '</b>';
            }).join('<br>');
          case 'ordering':
            return [].concat(a).map(function (id, i) { var it = (q.items || []).filter(function (x) { return x.id === id; })[0]; return (i + 1) + '. ' + esc(it ? it.text : id); }).join('<br>');
          case 'file-upload':
            return a && a.url && /^https:\/\//.test(a.url) ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + icon('download') + ' ' + esc(a.name || 'Open file') + '</a>' + (/\.(png|jpe?g|webp|gif)$/i.test(a.url) ? '<img src="' + esc(a.url) + '" alt="" style="display:block;max-width:100%;max-height:360px;margin-top:8px;border-radius:8px">' : '') : '<span class="muted">No file</span>';
          default:
            return esc(typeof a === 'object' ? JSON.stringify(a) : a);
        }
      }
      function fmtKey(q, k) {
        switch (q.type) {
          case 'multiple-choice':
          case 'multiple-select':
            return fmtAnswer(q, k.correct || []);
          case 'true-false':
            return k.correct === true ? 'True' : k.correct === false ? 'False' : '—';
          case 'fill-blank':
            return (k.blanks || []).map(function (b, i) { return 'Blank ' + (i + 1) + ': ' + esc((b.accepted || []).join(' / ')); }).join('<br>');
          case 'short-answer':
            return k.manual ? '' : esc((k.accepted || []).join(' / '));
          case 'numeric':
            return k.min !== undefined ? esc(k.min + ' to ' + k.max) : esc(k.value + (Number(k.tolerance) ? ' ± ' + k.tolerance : '') + (q.unit ? ' ' + q.unit : ''));
          case 'matching':
            return fmtAnswer(q, k.pairs || {});
          case 'ordering':
            return fmtAnswer(q, k.order || []);
          default:
            return '';
        }
      }
      var STATUS = { correct: ['green', 'Correct'], partial: ['amber', 'Part marks'], incorrect: ['red', 'Wrong'], unanswered: ['', 'Blank'], pending: ['amber', 'To mark'] };

      function markBox(q, item, mark, prefix) {
        var max = q.points;
        var val = mark ? mark.score : item && item.status !== 'pending' ? item.score : '';
        var steps = [];
        for (var s = 0; s <= max; s += max > 5 ? Math.ceil(max / 5) : max <= 2 ? 0.5 : 1) steps.push(s);
        if (steps[steps.length - 1] !== max) steps.push(max);
        return '<div class="markbox"><label class="field" style="margin:0"><span class="small">Mark (out of ' + esc(max) + ')</span><input class="input" type="number" step="0.5" min="0" max="' + esc(max) + '" data-mark="' + esc(prefix) + '" value="' + esc(val) + '"><div class="quick">' + steps.map(function (s) { return '<button type="button" class="btn ghost sm" data-quick="' + s + '">' + s + '</button>'; }).join('') + '</div></label>' +
          '<label class="field" style="margin:0"><span class="small">Comment for the student (optional)</span><textarea class="input" rows="2" data-comment="' + esc(prefix) + '">' + esc(mark ? mark.comment : '') + '</textarea></label></div>';
      }
      function wireQuick(root) {
        root.addEventListener('click', function (e) {
          var b = e.target.closest('[data-quick]');
          if (!b) return;
          var inp = b.closest('.markbox').querySelector('[data-mark]');
          inp.value = b.dataset.quick;
          inp.dispatchEvent(new Event('input', { bubbles: true }));
        });
      }

      // ---------------------------------------------------------------- attempt panel
      async function openPanel(id) {
        setParam('attempt', id);
        var wrap = document.createElement('div');
        wrap.className = 'panel-wrap';
        wrap.innerHTML = '<aside class="panel" role="dialog" aria-modal="true" aria-label="Attempt"><div class="panel-head"><button class="icon-btn" data-close aria-label="Close">' + icon('x') + '</button><b id="pTitle">Loading…</b></div><div class="panel-body" id="pBody"><div class="card skeleton" style="height:200px"></div></div></aside>';
        document.body.appendChild(wrap);
        function close() {
          wrap.remove();
          setParam('attempt', '');
          document.removeEventListener('keydown', onKey);
        }
        function onKey(e) { if (e.key === 'Escape') close(); }
        document.addEventListener('keydown', onKey);
        wrap.addEventListener('click', function (e) { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
        var body = wrap.querySelector('#pBody');
        var data;
        try {
          data = await DBI.api('GET', '/admin/attempts/' + encodeURIComponent(id));
        } catch (e) {
          body.innerHTML = '<div class="alert error">' + esc(e.message) + '</div>';
          return;
        }
        var a = data.attempt;
        a.id = a.id || id;
        wrap.querySelector('#pTitle').textContent = nameOf(a) + ' · ' + (a.assessmentTitle || '');
        if (data.legacy) {
          body.innerHTML = '<div class="card"><p>This attempt was recorded by the old system. Score: <b>' + esc(a.score != null ? a.score + '%' : '—') + '</b></p><p class="muted small">Old attempts stored answers in a format that cannot be re-marked reliably.</p></div>';
          return;
        }
        var deadline = a.deadline ? ms(a.deadline) + (Number(a.extraSeconds) || 0) * 1000 : 0;
        var ev = (a.integrity && a.integrity.events) || [];
        var byType = (a.integrity && a.integrity.byType) || {};
        var ips = a.ips || [];
        var head =
          '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="muted small">' + esc(a.studentId) + ' · attempt ' + esc(a.attemptNumber || 1) + '</div><div style="font-size:1.8rem;font-weight:800">' + (a.status === 'in-progress' ? 'In progress' : isPending(a) ? 'To mark' : esc(a.score) + '%') + '</div>' +
          '<div class="small">' + (a.status === 'submitted' ? esc(a.earnedPoints) + ' / ' + esc(a.totalPoints) + ' marks · ' + (a.released ? '<span class="badge green">Released to student</span>' : '<span class="badge">Not released</span>') : a.status === 'void' ? '<span class="badge red">Void</span> ' + esc(a.voidReason || '') : deadline ? 'Time left: ' + esc(DBI.fmtDuration(Math.max(0, Math.round((deadline - Date.now()) / 1000)))) : '') + '</div></div>' +
          '<div class="row" id="pActs"></div></div>' +
          '<dl class="kv" style="margin-top:12px"><dt>Started</dt><dd>' + esc(DBI.fmtDate(a.startedAt, true)) + '</dd><dt>Submitted</dt><dd>' + esc(DBI.fmtDate(a.submittedAt, true)) + (a.offlineSubmit ? ' (finished offline' + (a.sealedAt ? ' at ' + esc(DBI.fmtDate(a.sealedAt, true)) : '') + ')' : '') + (a.lateSync ? ' <span class="badge amber">Late upload</span>' : '') + '</dd>' +
          '<dt>Time taken</dt><dd>' + (a.timeTaken ? esc(DBI.fmtDuration(a.timeTaken)) : '—') + '</dd><dt>Devices / networks</dt><dd>' + esc(ips.length) + ' IP address' + (ips.length === 1 ? '' : 'es') + (byType['device-change'] ? ' · moved device ' + byType['device-change'] + '×' : '') + '</dd></dl></div>';

        var integ = '<div class="card" style="margin-top:12px"><h2 style="font-size:1.05rem">Integrity log ' + (a.integrity && a.integrity.locked ? '<span class="badge red">Paused</span>' : '') + '</h2>' +
          (Object.keys(byType).length ? '<div class="chip-list" style="margin:8px 0">' + Object.keys(byType).map(function (t) { return '<span class="badge ' + (['online', 'resume', 'offline'].indexOf(t) !== -1 ? '' : 'amber') + '">' + esc(LABELS[t] || t) + ' × ' + esc(byType[t]) + '</span>'; }).join('') + '</div>' : '<p class="muted small">Nothing unusual was recorded.</p>') +
          (ev.length ? '<details><summary class="small">Show all ' + ev.length + ' events</summary><ul class="timeline">' + ev.slice().sort(function (x, y) { return ms(x.at) - ms(y.at); }).map(function (e) {
            var qi = e.q ? a.questionIds.indexOf(e.q) : -1;
            return '<li><time>' + esc(new Date(ms(e.at)).toLocaleTimeString('en-GB')) + '</time><span>' + esc(LABELS[e.type] || e.type) + (qi !== -1 ? ' · Q' + (qi + 1) : '') + (e.detail ? ' <span class="muted">' + esc(e.detail) + '</span>' : '') + '</span></li>';
          }).join('') + '</ul></details>' : '') + '<p class="hint">Phones lose focus for calls and notifications. Look at how long and how often before deciding.</p></div>';

        var items = (data.questions || []).map(function (row, i) {
          var q = row.question, k = row.key || {};
          var item = (a.grading && a.grading.items && a.grading.items[q.id]) || (a.status === 'in-progress' ? null : { status: 'unanswered', score: 0, max: q.points });
          var mark = (a.manualMarks || {})[q.id];
          var st = item ? STATUS[item.status] || ['', item.status] : ['blue', 'Not submitted'];
          var keyHtml = fmtKey(q, k);
          var manual = item && (item.status === 'pending' || G.MANUAL_TYPES.indexOf(q.type) !== -1 || mark);
          return '<div class="item' + (item && item.status === 'pending' ? ' pending' : '') + '" data-q="' + esc(q.id) + '"><div class="row" style="justify-content:space-between"><h3>Q' + (i + 1) + '. <span class="badge ' + st[0] + '">' + st[1] + '</span></h3><span class="small muted">' + (item ? esc(item.score) + ' / ' + esc(item.max) : esc(q.points) + ' marks') + (mark ? ' · marked by ' + esc(mark.by || 'teacher') : '') + '</span></div>' +
            '<div class="small" style="margin-bottom:8px">' + DBI.rich(q.text) + '</div>' +
            '<div class="small muted">Student’s answer</div><div class="ans' + (q.type === 'code' ? ' code' : '') + '">' + fmtAnswer(q, (a.answers || {})[q.id]) + '</div>' +
            (keyHtml ? '<div class="small" style="margin-top:6px"><span class="muted">Correct:</span> ' + keyHtml + '</div>' : '') +
            (k.rubric ? '<details class="small" style="margin-top:6px"><summary>Marking guide</summary><div class="ans">' + esc(k.rubric) + '</div></details>' : '') +
            (k.sampleAnswer ? '<details class="small"><summary>Model answer</summary><div class="ans' + (q.type === 'code' ? ' code' : '') + '">' + esc(k.sampleAnswer) + '</div></details>' : '') +
            (a.status === 'in-progress' ? '' : manual ? markBox(q, item, mark, q.id) : '<button type="button" class="btn ghost sm" data-override="' + esc(q.id) + '" style="margin-top:8px">' + icon('edit') + 'Change mark</button>') + '</div>';
        }).join('');

        body.innerHTML = head + integ + '<h2 style="font-size:1.05rem;margin:18px 0 10px">Answers</h2>' + items +
          (a.status === 'submitted' ? '<div class="card" style="position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"><label class="check" style="margin-right:auto"><input type="checkbox" id="pRelease"' + (a.released || ['end', 'per-question'].indexOf(data.policy.display) !== -1 ? ' checked' : '') + '><span>Release to the student when fully marked</span></label><button class="btn primary" id="pSave">' + icon('check') + 'Save marks</button></div>' : '');
        wireQuick(body);

        body.addEventListener('click', function (e) {
          var o = e.target.closest('[data-override]');
          if (!o) return;
          var row = (data.questions || []).filter(function (r) { return r.question.id === o.dataset.override; })[0];
          o.insertAdjacentHTML('afterend', markBox(row.question, a.grading.items[row.question.id], null, row.question.id));
          o.remove();
        });

        var acts = [];
        if (a.status === 'in-progress') {
          if (a.integrity && a.integrity.locked) acts.push(['unlock', 'Unlock', 'primary']);
          acts.push(['extend', 'Add time', 'ghost'], ['force-submit', 'Submit now', 'ghost']);
        }
        if (a.status === 'submitted') acts.push([a.released ? 'unrelease' : 'release', a.released ? 'Hide result' : 'Release result', 'ghost']);
        if (a.status !== 'void') acts.push(['void', 'Void', 'ghost']);
        else acts.push(['restore', 'Restore', 'ghost']);
        var actBox = body.querySelector('#pActs');
        actBox.innerHTML = acts.map(function (x) { return '<button class="btn ' + x[2] + ' sm" data-action="' + x[0] + '">' + x[1] + '</button>'; }).join('');
        actBox.addEventListener('click', async function (e) {
          var b = e.target.closest('[data-action]');
          if (!b) return;
          var act = b.dataset.action, payload = { action: act };
          if (act === 'extend') {
            var mins = await DBI.modal({ title: 'Add time', body: '<label class="field"><span>Extra minutes</span><input class="input" type="number" min="1" max="600" value="10" id="xm"></label>', actions: [{ label: 'Cancel', value: null }, { label: 'Add time', kind: 'primary', value: function (w) { return Number(w.querySelector('#xm').value); } }] });
            if (!mins) return;
            payload.minutes = mins;
          }
          if (act === 'void') {
            var reason = await DBI.modal({ title: 'Void this attempt?', body: '<p>The attempt will not count and the student will not see a result.</p><label class="field"><span>Reason (kept in the audit log)</span><input class="input" id="vr"></label>', actions: [{ label: 'Cancel', value: null }, { label: 'Void', kind: 'danger', value: function (w) { return w.querySelector('#vr').value || 'No reason given'; } }] });
            if (!reason) return;
            payload.reason = reason;
          }
          if (act === 'force-submit' && !(await DBI.confirm('Submit this attempt now?', 'The student’s saved answers are marked straight away. Answers still on their device and not yet uploaded will be lost.', 'Submit now', true))) return;
          DBI.busy(b, true, '…');
          try {
            await DBI.api('POST', '/admin/attempts/' + encodeURIComponent(id) + '/action', payload);
            DBI.toast('Done', 'ok');
            close();
            await load();
            openPanel(id);
          } catch (err) {
            DBI.toast(err.message, 'error');
            DBI.busy(b, false);
          }
        });

        var save = body.querySelector('#pSave');
        if (save)
          save.onclick = async function () {
            var marks = {};
            var bad = false;
            body.querySelectorAll('[data-mark]').forEach(function (inp) {
              var qid = inp.dataset.mark;
              if (inp.value === '') return;
              var max = Number(inp.max);
              var v = Number(inp.value);
              if (isNaN(v) || v < 0 || v > max) {
                inp.focus();
                bad = true;
              }
              marks[qid] = { score: v, comment: body.querySelector('[data-comment="' + qid + '"]').value.trim() };
            });
            if (bad) return DBI.toast('Marks must be between 0 and the question’s maximum.', 'error');
            if (!Object.keys(marks).length) return DBI.toast('Enter at least one mark.', 'error');
            DBI.busy(save, true, 'Saving…');
            try {
              var r = await DBI.api('POST', '/admin/attempts/' + encodeURIComponent(id) + '/mark', { marks: marks, release: body.querySelector('#pRelease').checked ? undefined : false });
              var left = r.attempt.grading.pendingCount;
              DBI.toast(left ? 'Saved. ' + left + ' answer' + (left > 1 ? 's' : '') + ' still to mark.' : 'Saved. Score: ' + r.attempt.score + '%', 'ok');
              if (!left && body.querySelector('#pRelease').checked && !r.attempt.released) await DBI.api('POST', '/admin/attempts/' + encodeURIComponent(id) + '/action', { action: 'release' });
              close();
              await load();
            } catch (err) {
              DBI.toast(err.message, 'error');
              DBI.busy(save, false);
            }
          };
      }

      // ---------------------------------------------------------------- marking queue (one question at a time)
      var hideNames = false;
      function drawQueue() {
        var box = document.getElementById('view');
        var groups = questions.map(function (q) {
          var list = attempts.filter(function (a) { return a.status === 'submitted' && a.grading && a.grading.items && a.grading.items[q.id] && a.grading.items[q.id].status === 'pending'; });
          return { q: q, list: list };
        }).filter(function (g) { return g.list.length; });
        if (!groups.length) {
          box.innerHTML = '<div class="card empty">' + icon('check') + '<p>Nothing to mark for this assessment.</p></div>';
          return;
        }
        box.innerHTML = '<div class="toolbar"><label class="check"><input type="checkbox" id="anon"' + (hideNames ? ' checked' : '') + '><span>Hide student names while marking (fairer marking)</span></label></div>' + groups.map(function (g) {
          var k = keys[g.q.id] || {};
          var qn = questions.indexOf(g.q) + 1;
          // Flag answers that are very similar to another student's answer to the same question.
          var texts = g.list.map(function (a) { var v = a.answers[g.q.id]; return typeof v === 'string' ? v : ''; });
          return '<section class="card" style="margin-bottom:16px" data-group="' + esc(g.q.id) + '"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.05rem;margin:0">Q' + qn + ' · ' + esc(g.list.length) + ' to mark</h2><span class="badge blue">' + esc(g.q.points) + ' marks</span></div>' +
            '<div style="margin:8px 0">' + DBI.rich(g.q.text) + '</div>' +
            (k.rubric ? '<div class="alert small"><b>Guide:</b>&nbsp;' + esc(k.rubric) + '</div>' : '') +
            (k.sampleAnswer ? '<details class="small" style="margin-top:6px"><summary>Model answer</summary><div class="ans">' + esc(k.sampleAnswer) + '</div></details>' : '') +
            g.list.map(function (a, i) {
              var sims = [];
              texts.forEach(function (t, j) {
                if (j === i || !texts[i] || !t) return;
                var s = G.similarity(texts[i], t);
                if (s >= 0.5) sims.push((hideNames ? 'Student ' + (j + 1) : nameOf(g.list[j])) + ' (' + Math.round(s * 100) + '%)');
              });
              return '<div class="item" data-attempt="' + esc(a.id) + '" style="margin-top:12px"><div class="row" style="justify-content:space-between"><b>' + esc(hideNames ? 'Student ' + (i + 1) : nameOf(a)) + '</b>' + (typeof a.answers[g.q.id] === 'string' ? '<span class="small muted">' + G.wordCount(a.answers[g.q.id]) + ' words</span>' : '') + '</div>' +
                (sims.length ? '<div class="small sim">' + icon('alert') + ' Very similar to: ' + esc(sims.join(', ')) + '</div>' : '') +
                '<div class="ans' + (g.q.type === 'code' ? ' code' : '') + '" style="margin-top:6px">' + fmtAnswer(g.q, a.answers[g.q.id]) + '</div>' + markBox(g.q, null, null, a.id) + '</div>';
            }).join('') +
            '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-savegroup="' + esc(g.q.id) + '">' + icon('check') + 'Save marks for Q' + qn + '</button></div></section>';
        }).join('');
        wireQuick(box);
        box.querySelector('#anon').onchange = function (e) { hideNames = e.target.checked; drawQueue(); };
        box.querySelectorAll('[data-savegroup]').forEach(function (btn) {
          btn.onclick = async function () {
            var qid = btn.dataset.savegroup;
            var sec = box.querySelector('[data-group="' + qid + '"]');
            var q = qById(qid);
            var jobs = [];
            var bad = false;
            sec.querySelectorAll('[data-attempt]').forEach(function (el) {
              var v = el.querySelector('[data-mark]').value;
              if (v === '') return;
              var n = Number(v);
              if (isNaN(n) || n < 0 || n > q.points) bad = true;
              jobs.push({ id: el.dataset.attempt, mark: { score: n, comment: el.querySelector('[data-comment]').value.trim() } });
            });
            if (bad) return DBI.toast('Marks must be between 0 and ' + q.points + '.', 'error');
            if (!jobs.length) return DBI.toast('Enter at least one mark.', 'error');
            DBI.busy(btn, true, 'Saving ' + jobs.length + '…');
            var failed = 0;
            for (var i = 0; i < jobs.length; i++) {
              var m = {};
              m[qid] = jobs[i].mark;
              try {
                await DBI.api('POST', '/admin/attempts/' + encodeURIComponent(jobs[i].id) + '/mark', { marks: m }, { retries: 2 });
              } catch (e) {
                failed++;
              }
            }
            DBI.toast(failed ? failed + ' could not be saved. Try again.' : 'Saved ' + jobs.length + ' marks', failed ? 'error' : 'ok');
            await load();
          };
        });
      }

      // ---------------------------------------------------------------- question analysis
      function drawAnalysis() {
        var box = document.getElementById('view');
        var done = attempts.filter(function (a) { return a.status === 'submitted' && a.version === 2; });
        if (done.length < 1) {
          box.innerHTML = '<div class="card empty">' + icon('chart') + '<p>Analysis appears once students have submitted.</p></div>';
          return;
        }
        var scores = done.filter(function (a) { return a.gradingStatus !== 'pending-review'; }).map(function (a) { return Number(a.score) || 0; });
        var buckets = [0, 0, 0, 0, 0];
        scores.forEach(function (s) { buckets[Math.min(4, Math.floor(s / 20))]++; });
        var maxB = Math.max.apply(null, buckets.concat(1));
        var passRate = scores.length ? scores.filter(function (s) { return s >= (Number(current.passingScore) || 50); }).length / scores.length : 0;
        var html = '<div class="grid cols-2"><div class="card"><h2 style="font-size:1.05rem">Score spread</h2>' + ['0–19', '20–39', '40–59', '60–79', '80–100'].map(function (l, i) {
          return '<div class="opt-bar" style="grid-template-columns:60px 1fr 40px"><span>' + l + '%</span><div class="bar"><i style="width:' + (buckets[i] / maxB) * 100 + '%"></i></div><span>' + buckets[i] + '</span></div>';
        }).join('') + '</div><div class="card"><h2 style="font-size:1.05rem">Summary</h2><dl class="kv"><dt>Marked attempts</dt><dd>' + scores.length + '</dd><dt>Pass rate</dt><dd>' + pct(passRate) + '</dd><dt>Highest</dt><dd>' + (scores.length ? Math.max.apply(null, scores) + '%' : '—') + '</dd><dt>Lowest</dt><dd>' + (scores.length ? Math.min.apply(null, scores) + '%' : '—') + '</dd></dl>' +
          '<p class="hint" style="margin-top:10px"><b>Difficulty</b> is the share of marks students earned. <b>Discrimination</b> compares the top and bottom groups: a question the strong students get wrong more often than weak students usually has a wrong key or a confusing wording.</p></div></div>';
        html += questions.filter(function (q) { return !q.archived; }).map(function (q, i) {
          var rows = done.filter(function (a) { return (a.questionIds || []).indexOf(q.id) !== -1; }).map(function (a) { return { total: Number(a.score) || 0, item: a.grading && a.grading.items[q.id], answer: (a.answers || {})[q.id] }; });
          var s = G.itemAnalysis(q, rows);
          if (!s.n) return '<div class="card" style="margin-top:12px"><b>Q' + (i + 1) + '.</b> ' + esc(q.text.slice(0, 120)) + ' <span class="muted small">— no marked answers yet</span></div>';
          var d = s.discrimination;
          var dl = d === null ? ['', 'Not enough data'] : d < 0 ? ['red', 'Check the key'] : d < 0.1 ? ['amber', 'Weak'] : d < 0.3 ? ['blue', 'Fair'] : ['green', 'Good'];
          var diff = s.facility >= 0.85 ? 'Very easy' : s.facility >= 0.6 ? 'Easy' : s.facility >= 0.35 ? 'Medium' : s.facility >= 0.15 ? 'Hard' : 'Very hard';
          var k = keys[q.id] || {};
          var opts = s.options ? '<div style="margin-top:8px">' + q.options.map(function (o, j) {
            var c = s.options[o.id] || 0;
            var right = (k.correct || []).indexOf(o.id) !== -1;
            return '<div class="opt-bar"><b>' + String.fromCharCode(65 + j) + '</b><div><div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(o.text) + (right ? ' ' + icon('check') : '') + '</div><div class="bar"><i class="' + (right ? 'right' : '') + '" style="width:' + (c / s.n) * 100 + '%"></i></div></div><span class="small">' + c + ' (' + pct(c / s.n) + ')</span></div>';
          }).join('') + '</div>' : '';
          return '<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="flex:1;min-width:0"><b>Q' + (i + 1) + '.</b> ' + DBI.rich(q.text.length > 200 ? q.text.slice(0, 200) + '…' : q.text) + '</div><a class="btn ghost sm" href="questions.html?a=' + encodeURIComponent(current.id) + '">' + icon('edit') + 'Edit</a></div>' +
            '<div class="row small" style="margin-top:8px"><span>Difficulty: <b>' + diff + '</b> (' + pct(s.facility) + ' of marks earned)</span><span>Discrimination: <span class="badge ' + dl[0] + '">' + dl[1] + (d !== null ? ' ' + d.toFixed(2) : '') + '</span></span><span class="muted">' + s.n + ' answers · ' + s.unanswered + ' blank</span></div>' + opts + '</div>';
        }).join('');
        box.innerHTML = html;
      }

      // ---------------------------------------------------------------- live monitor
      function drawLive() {
        var box = document.getElementById('view');
        box.innerHTML = '<div class="card skeleton" style="height:120px"></div>';
        if (unsubLive) unsubLive();
        unsubLive = DBI.db.collection('studentResults').where('assessmentId', '==', current.id).where('status', '==', 'in-progress').onSnapshot(function (snap) {
          document.getElementById('liveDot').hidden = snap.empty;
          var list = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return nameOf(a).localeCompare(nameOf(b)); });
          if (!list.length) {
            box.innerHTML = '<div class="card empty">' + icon('play') + '<p>No one is taking this assessment right now. This page updates by itself.</p></div>';
            return;
          }
          var now = Date.now();
          box.innerHTML = '<p class="small muted">' + list.length + ' student' + (list.length === 1 ? '' : 's') + ' in the test. Updates automatically. Students who lose internet keep working and show as “offline”.</p><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Progress</th><th>Time left</th><th>Connection</th><th>Alerts</th></tr></thead><tbody>' + list.map(function (a) {
            var seen = now - ms(a.lastSeenAt);
            var dot = seen < 90000 ? ['live', 'Online'] : seen < 300000 ? ['idle', 'Quiet ' + Math.round(seen / 60000) + ' min'] : ['off', 'Offline ' + Math.round(seen / 60000) + ' min'];
            var answered = Object.keys(a.answers || {}).filter(function (k) { return !G.isBlank(a.answers[k]); }).length;
            var total = a.totalQuestions || (a.questionIds || []).length || 1;
            var deadline = a.deadline ? ms(a.deadline) + (Number(a.extraSeconds) || 0) * 1000 : 0;
            var n = a.integrity ? a.integrity.count : 0;
            return '<tr data-open="' + esc(a.id) + '" style="cursor:pointer"><td><a href="#" data-open="' + esc(a.id) + '"><b>' + esc(nameOf(a)) + '</b></a><div class="muted small">' + esc(a.studentId) + '</div></td>' +
              '<td style="min-width:140px"><div class="bar"><i style="width:' + (answered / total) * 100 + '%"></i></div><span class="small">' + answered + ' / ' + total + '</span></td>' +
              '<td class="small">' + (deadline ? esc(DBI.fmtDuration(Math.max(0, Math.round((deadline - now) / 1000)))) : '—') + '</td>' +
              '<td class="small"><span class="dot ' + dot[0] + '"></span> ' + dot[1] + '</td>' +
              '<td>' + (a.integrity && a.integrity.locked ? '<span class="badge red">Paused</span>' : n ? '<span class="badge amber">' + n + '</span>' : '<span class="badge green">OK</span>') + '</td></tr>';
          }).join('') + '</tbody></table></div>';
        }, function (e) {
          box.innerHTML = '<div class="alert error">' + esc(e.message) + '</div>';
        });
      }

      // ---------------------------------------------------------------- bulk actions
      document.getElementById('regradeBtn').onclick = async function () {
        if (!current) return;
        if (!(await DBI.confirm('Regrade every submitted attempt?', 'Use this after fixing an answer key. Teacher marks are kept. Scores and certificates update.', 'Regrade'))) return;
        var b = this;
        DBI.busy(b, true, 'Regrading…');
        try {
          var r = await DBI.api('POST', '/admin/assessments/' + encodeURIComponent(current.id) + '/regrade', {}, { timeout: 120000 });
          DBI.toast('Regraded ' + r.attempts + ' attempts · ' + r.changed + ' scores changed', 'ok', 6000);
          await load();
        } catch (e) {
          DBI.toast(e.message, 'error');
        }
        DBI.busy(b, false);
      };
      document.getElementById('releaseBtn').onclick = async function () {
        if (!current) return;
        var ready = attempts.filter(function (a) { return a.status === 'submitted' && !a.released && a.gradingStatus !== 'pending-review' && a.version === 2; });
        var waiting = attempts.filter(isPending).length;
        if (!ready.length) return DBI.modal({ title: 'Nothing to release', body: '<p>' + (waiting ? waiting + ' attempt' + (waiting > 1 ? 's are' : ' is') + ' still waiting to be marked. Results are released once they are fully marked.' : 'All marked results have already been released.') + '</p>' });
        if (!(await DBI.confirm('Release ' + ready.length + ' result' + (ready.length > 1 ? 's' : '') + '?', 'Students will see their score' + (current.showEndCorrect ? ' and the correct answers' : '') + '.' + (waiting ? ' ' + waiting + ' still need marking and stay hidden.' : ''), 'Release'))) return;
        var b = this;
        DBI.busy(b, true, 'Releasing…');
        var failed = 0;
        for (var i = 0; i < ready.length; i++) {
          try {
            await DBI.api('POST', '/admin/attempts/' + encodeURIComponent(ready[i].id) + '/action', { action: 'release' }, { retries: 2 });
          } catch (e) {
            failed++;
          }
        }
        DBI.toast(failed ? failed + ' failed — try again' : 'Released ' + ready.length + ' results', failed ? 'error' : 'ok');
        DBI.busy(b, false);
        await load();
      };
      document.getElementById('exportBtn').onclick = function () {
        if (!current) return;
        var qs = questions.filter(function (q) { return !q.archived; });
        var rows = [['Student ID', 'Name', 'Attempt', 'Status', 'Score %', 'Marks', 'Out of', 'Passed', 'Released', 'Started', 'Submitted', 'Time (min)', 'Alerts', 'Offline submit'].concat(qs.map(function (q, i) { return 'Q' + (i + 1) + ' (' + q.points + ')'; }))];
        attempts.forEach(function (a) {
          rows.push([a.studentId, nameOf(a), a.attemptNumber || 1, a.status === 'submitted' && isPending(a) ? 'to mark' : a.status, a.status === 'submitted' && !isPending(a) ? a.score : '', a.earnedPoints == null ? '' : a.earnedPoints, a.totalPoints == null ? '' : a.totalPoints, a.passed ? 'yes' : 'no', a.released ? 'yes' : 'no', a.startedAt || '', a.submittedAt || '', a.timeTaken ? Math.round(a.timeTaken / 6) / 10 : '', a.integrity ? a.integrity.count : 0, a.offlineSubmit ? 'yes' : '']
            .concat(qs.map(function (q) { var it = a.grading && a.grading.items && a.grading.items[q.id]; return it ? (it.status === 'pending' ? 'to mark' : it.score) : ''; })));
        });
        DBI.downloadCsv((current.title || 'results').replace(/[^\w-]+/g, '_') + '_results.csv', rows);
      };

      init().catch(function (e) { document.getElementById('view').innerHTML = '<div class="card empty"><p>' + esc(e.message) + '</p></div>'; });
    })();
  </script>
</body>
</html>
