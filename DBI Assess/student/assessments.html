<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My tests — DBI Assess</title>
  <meta name="theme-color" content="#03c14b">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
    .tabs button { flex-shrink: 0; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: 600 .92rem var(--font); cursor: pointer; }
    .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .test-card .btn { width: 100%; }
    @media (min-width: 640px) { .test-card .btn { width: auto; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>My tests</h1><p>Tap a test to start. Tests keep working if your internet goes off.</p></div></div>
    <label class="field" style="max-width:420px"><span class="sr-only">Search</span><input class="input" id="q" type="search" placeholder="Search tests…"></label>
    <div class="tabs" role="group" aria-label="Filter" id="tabs"></div>
    <div id="msg"></div>
    <div class="grid cols-2" id="list"><div class="card skeleton" style="height:150px"></div><div class="card skeleton" style="height:150px"></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/student.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireStudent();
      DBI.studentShell('assessments', me);
      var esc = DBI.esc, icon = DBI.icon;
      var filter = 'todo';
      var items = [];
      var tabs = [['todo', 'To do'], ['upcoming', 'Coming soon'], ['done', 'Finished'], ['all', 'All']];
      function draw() {
        document.getElementById('tabs').innerHTML = tabs.map(function (t) { return '<button aria-pressed="' + (filter === t[0]) + '" data-f="' + t[0] + '">' + t[1] + '</button>'; }).join('');
        var term = document.getElementById('q').value.trim().toLowerCase();
        var shown = items.filter(function (i) {
          var ok = filter === 'all' || (filter === 'todo' && ['in-progress', 'open', 'retake'].indexOf(i.state) !== -1) || (filter === 'upcoming' && i.state === 'upcoming') || (filter === 'done' && ['done', 'closed'].indexOf(i.state) !== -1);
          return ok && (!term || String(i.a.title).toLowerCase().indexOf(term) !== -1 || String(i.a.department || '').toLowerCase().indexOf(term) !== -1);
        });
        document.getElementById('list').innerHTML = shown.length ? shown.map(DBIStudent.testCard).join('') : '<div class="card empty" style="grid-column:1/-1">' + icon('list') + '<p>Nothing here.</p></div>';
      }
      document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-f]');
        if (b) { filter = b.dataset.f; draw(); }
      });
      document.getElementById('q').addEventListener('input', draw);
      try {
        var data = await DBIStudent.loadOverview(me);
        items = DBIStudent.classify(data, me);
        if (data.stale) document.getElementById('msg').innerHTML = '<div class="alert warn" style="margin-bottom:12px">' + icon('wifiOff') + '<span>Offline — showing the list saved on ' + esc(DBI.fmtDate(data.at, true)) + '. You need internet to start a new test.</span></div>';
        draw();
      } catch (e) {
        document.getElementById('list').innerHTML = '<div class="card empty" style="grid-column:1/-1">' + icon('wifiOff') + '<p>' + esc(e.message) + '</p></div>';
      }
    })();
  </script>
</body>
</html>
