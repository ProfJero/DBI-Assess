<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DBI Assess - Student Login</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a3d2e 0%, #166534 30%, #15803d 60%, #22c55e 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND BUBBLES ===== */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: floatBubble linear infinite;
        }

        .bubble:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-duration: 18s; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 120px; height: 120px; right: 15%; animation-duration: 22s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 60px; height: 60px; left: 30%; bottom: -60px; animation-duration: 15s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 100px; height: 100px; right: 30%; bottom: -100px; animation-duration: 20s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 50px; height: 50px; left: 60%; bottom: -50px; animation-duration: 12s; animation-delay: 3s; }
        .bubble:nth-child(6) { width: 90px; height: 90px; right: 5%; bottom: -90px; animation-duration: 19s; animation-delay: 5s; }
        .bubble:nth-child(7) { width: 40px; height: 40px; left: 80%; bottom: -40px; animation-duration: 14s; animation-delay: 2.5s; }
        .bubble:nth-child(8) { width: 150px; height: 150px; left: 50%; bottom: -150px; animation-duration: 25s; animation-delay: 0.5s; opacity: 0.3; }

        @keyframes floatBubble {
            0% { transform: translateY(0) scale(0.8); opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        /* ===== FLOATING PARTICLES ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        .particle:nth-child(1) { left: 5%; animation-duration: 15s; animation-delay: 0s; }
        .particle:nth-child(2) { left: 15%; animation-duration: 18s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 25%; animation-duration: 12s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 35%; animation-duration: 20s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 45%; animation-duration: 16s; animation-delay: 3s; }
        .particle:nth-child(6) { left: 55%; animation-duration: 14s; animation-delay: 5s; }
        .particle:nth-child(7) { left: 65%; animation-duration: 19s; animation-delay: 2.5s; }
        .particle:nth-child(8) { left: 75%; animation-duration: 13s; animation-delay: 1.5s; }
        .particle:nth-child(9) { left: 85%; animation-duration: 17s; animation-delay: 3.5s; }
        .particle:nth-child(10) { left: 95%; animation-duration: 21s; animation-delay: 0.5s; }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* ===== LOGIN CONTAINER ===== */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 32px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35), 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        /* ===== LOGO & HEADER ===== */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #166534, #22c55e);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 4px 15px rgba(22, 101, 52, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulseLogo 2s ease-in-out infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(22, 101, 52, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 6px 25px rgba(22, 101, 52, 0.4); }
        }

        .logo-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(22, 101, 52, 0.5);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: #1a1f2c;
            letter-spacing: -0.5px;
        }

        .logo-text .highlight {
            background: linear-gradient(135deg, #166534, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-sub {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .welcome-text {
            font-size: 20px;
            font-weight: 700;
            color: #1a1f2c;
            margin-bottom: 4px;
        }

        .welcome-sub {
            font-size: 14px;
            color: #6b7280;
        }

        /* ===== FORM ===== */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a1f2c;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f3f4f6;
            border-radius: 12px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #22c55e;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .form-group .input-wrapper .input-icon {
            flex-shrink: 0;
            width: 44px;
            text-align: center;
            color: #9ca3af;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .form-group .input-wrapper:focus-within .input-icon {
            color: #166534;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 500;
            color: #1a1f2c;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .form-group .input-wrapper input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        .form-group .input-wrapper .toggle-password {
            flex-shrink: 0;
            width: 44px;
            text-align: center;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s ease;
            background: none;
            border: none;
            padding: 0;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: #166534;
        }

        /* ===== OPTIONS ===== */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: -4px;
        }

        .form-options .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #4b5563;
            transition: color 0.2s ease;
        }

        .form-options .remember-me:hover {
            color: #1a1f2c;
        }

        .form-options .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #166534;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.2s ease;
        }

        .form-options .remember-me input[type="checkbox"]:hover {
            transform: scale(1.1);
        }

        .form-options .forgot-link {
            color: #166534;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .form-options .forgot-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #166534;
            transition: width 0.3s ease;
        }

        .form-options .forgot-link:hover::after {
            width: 100%;
        }

        .form-options .forgot-link:hover {
            color: #0a3d2e;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #166534, #22c55e);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 4px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(22, 101, 52, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0px);
            box-shadow: 0 4px 15px rgba(22, 101, 52, 0.25);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-submit .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== ERROR MESSAGES ===== */
        .error-message {
            display: none;
            padding: 12px 16px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            color: #dc2626;
            font-size: 13px;
            font-weight: 500;
            margin-top: 4px;
            animation: shake 0.5s ease;
        }

        .error-message.show {
            display: block;
        }

        .error-message i {
            margin-right: 8px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ===== SUCCESS TOAST ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #166534;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast i {
            font-size: 20px;
        }

        .toast.error {
            background: #dc2626;
        }

        /* ===== FOOTER ===== */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .login-footer p {
            font-size: 13px;
            color: #6b7280;
        }

        .login-footer .brand {
            font-weight: 700;
            color: #166534;
        }

        .login-footer .version {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px 24px; border-radius: 20px; }
            .logo-icon { width: 44px; height: 44px; font-size: 22px; }
            .logo-text { font-size: 22px; }
            .welcome-text { font-size: 18px; }
            .form-group .input-wrapper input { font-size: 14px; padding: 12px 12px 12px 0; }
            .form-group .input-wrapper .input-icon { width: 36px; font-size: 14px; }
            .btn-submit { padding: 14px; font-size: 15px; }
            .form-options { flex-wrap: wrap; gap: 8px; }
            .form-options .forgot-link { font-size: 12px; }
            .toast { top: 10px; right: 10px; left: 10px; max-width: calc(100% - 20px); font-size: 13px; padding: 14px 18px; }
        }

        @media (max-width: 360px) {
            .login-card { padding: 20px 16px; }
            .logo-text { font-size: 18px; }
            .logo-icon { width: 38px; height: 38px; font-size: 18px; }
            .welcome-text { font-size: 16px; }
        }

        /* ===== UTILITY ===== */
        .text-center { text-align: center; }
        .mt-8 { margin-top: 8px; }
    </style>
</head>
<body>

    <!-- ===== ANIMATED BACKGROUND ===== -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ===== LOGIN WRAPPER ===== -->
    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Header -->
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div>
                        <div class="logo-text">
                            DBI <span class="highlight">Assess</span>
                        </div>
                        <div class="logo-sub">Digital Bridge Initiative</div>
                    </div>
                </div>
                <div class="welcome-text">Welcome Back! 👋</div>
                <div class="welcome-sub">Log in to continue your learning journey</div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid credentials. Please try again.</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                <!-- Student ID -->
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-id-card"></i></span>
                        <input 
                            type="text" 
                            id="studentId" 
                            placeholder="Enter your DBI Student ID" 
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Options -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="loginBtn">
                    <span class="btn-content">
                        <span class="btn-text">Log In</span>
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>Don't have an account? <a href="#" style="color: #166534; font-weight: 600; text-decoration: none;">Contact your instructor</a></p>
                <div class="version">Assessment Platform v1.0</div>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Login successful!</span>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ============================================================
        // FIREBASE CONFIGURATIONS
        // ============================================================

        // Main Database (rth-admin-dues) - where student credentials are stored
        const mainFirebaseConfig = {
            apiKey: "AIzaSyDqB6Qekb-YcaPzEqvlHKhFGDOx6nh-7bA",
            authDomain: "rth-admin-dues.firebaseapp.com",
            projectId: "rth-admin-dues",
            storageBucket: "rth-admin-dues.firebasestorage.app",
            messagingSenderId: "825570303872",
            appId: "1:825570303872:web:89fe0f6b751b7ae2f42b65",
            measurementId: "G-6512Y183F4"
        };

        // Assessment Database (dbi-assess) - where student progress is stored
        const assessmentFirebaseConfig = {
            apiKey: "AIzaSyCdrmMMmZ0xdC2A_GXdAcWnUAa1i6QbjwQ",
            authDomain: "dbi-assess.firebaseapp.com",
            projectId: "dbi-assess",
            storageBucket: "dbi-assess.firebasestorage.app",
            messagingSenderId: "558455201415",
            appId: "1:558455201415:web:4a12a7b7c4cff9ecb6a222",
            measurementId: "G-FE2BPSJ4C5"
        };

        // ============================================================
        // INITIALIZE FIREBASE APPS
        // ============================================================

        let mainDb = null;
        let assessmentDb = null;
        let firebaseInitialized = false;

        try {
            // Initialize Main Firebase (rth-admin-dues)
            if (!firebase.apps.some(app => app.name === 'mainApp')) {
                const mainApp = firebase.initializeApp(mainFirebaseConfig, 'mainApp');
                mainDb = firebase.firestore(mainApp);
                console.log('✅ Main Firebase (rth-admin-dues) initialized successfully');
            } else {
                mainDb = firebase.firestore(firebase.app('mainApp'));
                console.log('✅ Main Firebase already initialized');
            }

            // Initialize Assessment Firebase (dbi-assess)
            if (!firebase.apps.some(app => app.name === 'assessmentApp')) {
                const assessmentApp = firebase.initializeApp(assessmentFirebaseConfig, 'assessmentApp');
                assessmentDb = firebase.firestore(assessmentApp);
                console.log('✅ Assessment Firebase (dbi-assess) initialized successfully');
            } else {
                assessmentDb = firebase.firestore(firebase.app('assessmentApp'));
                console.log('✅ Assessment Firebase already initialized');
            }

            firebaseInitialized = true;
        } catch (error) {
            console.error('❌ Firebase initialization error:', error);
            showToast('Failed to connect to the server. Please refresh and try again.', true);
        }

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const form = document.getElementById('loginForm');
        const studentIdInput = document.getElementById('studentId');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const rememberMe = document.getElementById('rememberMe');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // ============================================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================================
        let passwordVisible = false;

        togglePasswordBtn.addEventListener('click', () => {
            passwordVisible = !passwordVisible;
            passwordInput.type = passwordVisible ? 'text' : 'password';
            togglePasswordBtn.innerHTML = passwordVisible 
                ? '<i class="fas fa-eye-slash"></i>' 
                : '<i class="fas fa-eye"></i>';
            
            togglePasswordBtn.style.transform = 'scale(1.2)';
            setTimeout(() => {
                togglePasswordBtn.style.transform = 'scale(1)';
            }, 200);
        });

        // ============================================================
        // TOAST FUNCTIONS
        // ============================================================
        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            toast.className = 'toast';
            if (isError) {
                toast.classList.add('error');
                toast.querySelector('i').className = 'fas fa-exclamation-circle';
            } else {
                toast.querySelector('i').className = 'fas fa-check-circle';
            }
            toast.classList.add('show');
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================================
        // ERROR FUNCTIONS
        // ============================================================
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
            
            clearTimeout(errorMessage._timeout);
            errorMessage._timeout = setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        // ============================================================
        // LOAD SAVED CREDENTIALS
        // ============================================================
        function loadSavedCredentials() {
            const saved = localStorage.getItem('dbi_assess_student_id');
            if (saved) {
                studentIdInput.value = saved;
                rememberMe.checked = true;
            }
        }

        loadSavedCredentials();

        // ============================================================
        // AUTHENTICATION FUNCTION
        // ============================================================
        async function authenticateUser(studentId, password) {
            try {
                console.log('🔍 Searching for student:', studentId);

                // First, try to find in Assessment DB (dbi-assess) - users collection
                let userData = null;
                let docId = null;
                let source = 'assessment';

                try {
                    const assessmentQuery = await assessmentDb.collection('users')
                        .where('studentId', '==', studentId)
                        .get();

                    if (!assessmentQuery.empty) {
                        const doc = assessmentQuery.docs[0];
                        userData = doc.data();
                        docId = doc.id;
                        source = 'assessment';
                        console.log('📋 Found user in Assessment DB');
                    }
                } catch (error) {
                    console.warn('Assessment DB query error:', error);
                }

                // If not found in Assessment DB, search in Main DB (rth-admin-dues)
                if (!userData) {
                    try {
                        const mainQuery = await mainDb.collection('eventRegistrations')
                            .where('studentId', '==', studentId)
                            .get();

                        if (!mainQuery.empty) {
                            const doc = mainQuery.docs[0];
                            userData = doc.data();
                            docId = doc.id;
                            source = 'main';
                            console.log('📋 Found user in Main DB');
                        }
                    } catch (error) {
                        console.warn('Main DB query error:', error);
                    }
                }

                if (!userData) {
                    console.log('❌ No student found with ID:', studentId);
                    return { success: false, error: 'Student ID not found. Please check your ID.' };
                }

                console.log('📋 User data:', {
                    firstName: userData.firstName,
                    lastName: userData.lastName,
                    studentId: userData.studentId,
                    hasPassword: !!userData.password,
                    source: source
                });

                // Check password
                if (userData.password !== password) {
                    console.log('❌ Password mismatch for student:', studentId);
                    return { success: false, error: 'Invalid password. Please try again.' };
                }

                // Password matched - login successful
                console.log('✅ Login successful for:', studentId);

                // If found in Main DB but not in Assessment DB, create user in Assessment DB
                if (source === 'main') {
                    try {
                        const assessmentUsersRef = assessmentDb.collection('users');
                        const assessmentQuery = await assessmentUsersRef.where('studentId', '==', studentId).get();

                        if (assessmentQuery.empty) {
                            console.log('📝 Creating user in assessment database...');
                            await assessmentUsersRef.add({
                                studentId: userData.studentId,
                                firstName: userData.firstName || '',
                                lastName: userData.lastName || '',
                                email: userData.email || '',
                                phone: userData.phone || '',
                                school: userData.school || '',
                                community: userData.community || '',
                                educationLevel: userData.educationLevel || '',
                                password: userData.password,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                                status: 'active',
                                registrationId: docId
                            });
                            console.log('✅ User created in assessment database');
                        } else {
                            // Update last login
                            const userDoc = assessmentQuery.docs[0];
                            await userDoc.ref.update({
                                lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            console.log('✅ Last login updated in assessment database');
                        }
                    } catch (assessmentError) {
                        console.warn('⚠️ Assessment DB sync error:', assessmentError);
                    }
                } else {
                    // Update last login in Assessment DB
                    try {
                        const userDoc = await assessmentDb.collection('users').doc(docId).get();
                        if (userDoc.exists) {
                            await userDoc.ref.update({
                                lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            console.log('✅ Last login updated');
                        }
                    } catch (error) {
                        console.warn('Could not update last login:', error);
                    }
                }

                return { 
                    success: true, 
                    user: {
                        ...userData,
                        id: docId,
                        source: source
                    }
                };

            } catch (error) {
                console.error('❌ Authentication error:', error);
                return { 
                    success: false, 
                    error: 'Connection error. Please check your internet and try again.' 
                };
            }
        }

        // ============================================================
        // FORM SUBMISSION - WITH REDIRECT
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            if (!firebaseInitialized) {
                showError('Firebase not initialized. Please refresh the page.');
                return;
            }

            const studentId = studentIdInput.value.trim().toUpperCase();
            const password = passwordInput.value.trim();

            // Validate
            if (!studentId) {
                showError('Please enter your Student ID.');
                studentIdInput.focus();
                studentIdInput.parentElement.style.borderColor = '#dc2626';
                setTimeout(() => {
                    studentIdInput.parentElement.style.borderColor = 'transparent';
                }, 2000);
                return;
            }

            if (!password) {
                showError('Please enter your password.');
                passwordInput.focus();
                passwordInput.parentElement.style.borderColor = '#dc2626';
                setTimeout(() => {
                    passwordInput.parentElement.style.borderColor = 'transparent';
                }, 2000);
                return;
            }

            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                // Authenticate user
                const result = await authenticateUser(studentId, password);

                if (result.success) {
                    // Save credentials if "Remember me" is checked
                    if (rememberMe.checked) {
                        localStorage.setItem('dbi_assess_student_id', studentId);
                    } else {
                        localStorage.removeItem('dbi_assess_student_id');
                    }

                    // Store user data in session for the dashboard
                    sessionStorage.setItem('dbi_assess_user', JSON.stringify(result.user));
                    
                    // Show success toast
                    showToast(`Welcome back, ${result.user.firstName || 'Student'}! 🎉`);
                    
                    // REDIRECT TO DASHBOARD
                    setTimeout(() => {
                        window.location.href = 'student/dashboard.html';
                    }, 1200);
                    
                } else {
                    // Authentication failed
                    showError(result.error || 'Invalid credentials. Please try again.');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    
                    // Shake the card
                    document.querySelector('.login-card').style.animation = 'shake 0.5s ease';
                    setTimeout(() => {
                        document.querySelector('.login-card').style.animation = '';
                    }, 500);
                }

            } catch (error) {
                console.error('❌ Login error:', error);
                showError(error.message || 'An unexpected error occurred. Please try again.');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // ============================================================
        // INPUT FOCUS ANIMATIONS
        // ============================================================
        document.querySelectorAll('.form-group .input-wrapper input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.borderColor = '#22c55e';
                this.parentElement.style.background = '#ffffff';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.borderColor = 'transparent';
                this.parentElement.style.background = '#f3f4f6';
            });
        });

        // ============================================================
        // KEYBOARD SHORTCUT: ESC to clear error
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideError();
            }
        });

        // ============================================================
        // CONSOLE WELCOME
        // ============================================================
        console.log('%c🎓 DBI Assess Platform', 'font-size: 24px; font-weight: bold; color: #166534;');
        console.log('%cBuilt with ❤️ for DBI Students', 'font-size: 14px; color: #22c55e;');
        console.log('%c📚 Learn. Grow. Succeed.', 'font-size: 14px; color: #6b7280;');
        console.log('🔐 Connected to:');
        console.log('  - Main DB: rth-admin-dues (for credentials)');
        console.log('  - Assessment DB: dbi-assess (for progress)');
    </script>

</body>
