<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My profile — DBI Assess</title>
  <meta name="theme-color" content="#03c14b">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <main class="page">
    <div class="page-head"><h1>My profile</h1></div>
    <div class="grid cols-2">
      <section class="card">
        <div class="row" style="margin-bottom:14px"><span class="avatar" id="av" style="width:56px;height:56px;font-size:1.1rem"></span><div><h2 id="nm" style="margin:0"></h2><span class="muted" id="sidl"></span></div></div>
        <form id="pf">
          <label class="field"><span>Phone</span><input class="input" id="phone" inputmode="tel" autocomplete="tel"></label>
          <label class="field"><span>Email</span><input class="input" id="email" type="email" autocomplete="email"></label>
          <label class="field"><span>School</span><input class="input" id="school"></label>
          <label class="field"><span>Community</span><input class="input" id="community"></label>
          <p class="hint" style="margin-top:-6px">To change your name or Student ID, ask DBI staff.</p>
          <button class="btn primary" type="submit">Save details</button>
        </form>
      </section>
      <section class="card">
        <h2>Change password</h2>
        <form id="pw">
          <label class="field"><span>Current password</span><input class="input" id="cur" type="password" autocomplete="current-password" required></label>
          <label class="field"><span>New password</span><input class="input" id="nw" type="password" autocomplete="new-password" minlength="6" required><span class="hint">At least 6 characters. Don’t share it with anyone.</span></label>
          <label class="field"><span>Repeat new password</span><input class="input" id="nw2" type="password" autocomplete="new-password" required></label>
          <button class="btn blue" type="submit">Change password</button>
        </form>
      </section>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireStudent();
      DBI.studentShell('profile', me);
      var p = me.profile || {};
      document.getElementById('av').textContent = DBI.initials(me.name);
      document.getElementById('nm').textContent = me.name;
      document.getElementById('sidl').textContent = me.studentId;
      ['phone', 'email', 'school', 'community'].forEach(function (k) { document.getElementById(k).value = p[k] || ''; });
      document.getElementById('pf').addEventListener('submit', async function (e) {
        e.preventDefault();
        var data = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        ['phone', 'email', 'school', 'community'].forEach(function (k) { data[k] = document.getElementById(k).value.trim(); });
        try {
          await DBI.db.collection('users').doc(me.user.uid).update(data);
          DBI.toast('Details saved', 'ok');
        } catch (err) {
          DBI.toast(navigator.onLine ? 'Could not save: ' + err.message : 'You are offline. Try again when connected.', 'error');
        }
      });
      document.getElementById('pw').addEventListener('submit', async function (e) {
        e.preventDefault();
        var nw = document.getElementById('nw').value;
        if (nw !== document.getElementById('nw2').value) return DBI.toast('The new passwords do not match.', 'error');
        try {
          await DBI.api('POST', '/auth/change-password', { currentPassword: document.getElementById('cur').value, newPassword: nw });
          e.target.reset();
          DBI.toast('Password changed', 'ok');
        } catch (err) {
          DBI.toast(err.message, 'error');
        }
      });
    })();
  </script>
</body>
</html>
