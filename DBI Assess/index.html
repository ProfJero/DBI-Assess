<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DBI Assess — Student Sign In</title>
  <meta name="description" content="DBI Assess: tests and quizzes for Digital Bridge Initiative students. Works on phones and with weak internet.">
  <meta name="theme-color" content="#03c14b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    .tagline { color: var(--muted); margin: 4px 0 0; }
    .switch { text-align: center; margin-top: 18px; font-size: .9rem; color: var(--muted); }
    .features { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: .8rem; }
    .features span { display: inline-flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <main class="auth-page">
    <div>
      <div class="auth-card">
        <div class="logo">
          <img src="images/DBI-Official-Logo.png" alt="Digital Bridge Initiative" width="220" height="66" style="width:220px;height:auto">
          <h1 style="margin-top:14px">DBI Assess</h1>
          <p class="tagline">Sign in to take your tests</p>
        </div>
        <div id="msg" role="alert"></div>
        <form id="form" method="post" action="javascript:void(0)" onsubmit="return false" novalidate>
          <label class="field">
            <span>Student ID</span>
            <input class="input" id="sid" name="studentId" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. DBI-25-001" required>
          </label>
          <label class="field">
            <span>Password</span>
            <div class="pw-wrap">
              <input class="input" id="pw" name="password" type="password" autocomplete="current-password" required style="padding-right:52px">
              <button type="button" class="icon-btn" id="showPw" aria-label="Show password"></button>
            </div>
          </label>
          <label class="check small" style="margin-bottom:16px">
            <input type="checkbox" id="shared">
            <span>This is a shared or school computer <span class="muted">(sign out automatically when the browser closes)</span></span>
          </label>
          <button class="btn primary block" id="go" type="submit">Sign in</button>
        </form>
        <p class="switch">Forgot your password? Ask your teacher or DBI staff to reset it.<br><a href="admin/index.html">Staff sign in</a></p>
      </div>
      <div class="features" id="features"></div>
      <p class="credit">Built by <b>ProfJero Digital Studio</b> · Powered by <b>Digital Bridge Initiative</b></p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="shared/config.js"></script>
  <script src="shared/core.js"></script>
  <script>
    (async function () {
      var form = document.getElementById('form');
      var sid = document.getElementById('sid');
      var pw = document.getElementById('pw');
      var msg = document.getElementById('msg');
      var go = document.getElementById('go');
      var showPw = document.getElementById('showPw');
      var next = new URLSearchParams(location.search).get('next');
      var safeNext = next && /^\/[^/]/.test(next) && next.indexOf('/student/') !== -1 ? next : 'student/dashboard.html';

      document.getElementById('features').innerHTML =
        '<span>' + DBI.icon('wifiOff') + 'Works with weak internet</span><span>' + DBI.icon('shield') + 'Safe & fair tests</span><span>' + DBI.icon('award') + 'Earn certificates</span>';
      showPw.innerHTML = DBI.icon('eye');
      showPw.onclick = function () {
        var shown = pw.type === 'text';
        pw.type = shown ? 'password' : 'text';
        showPw.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
      };
      try {
        sid.value = localStorage.getItem('dbi:lastStudentId') || '';
      } catch (e) {}
      if (sid.value) pw.focus();
      DBI.registerSW();

      function show(text, kind) {
        msg.innerHTML = text ? '<div class="alert ' + (kind || 'error') + '" style="margin-bottom:14px">' + DBI.icon(kind === 'ok' ? 'check' : 'alert') + '<span>' + DBI.esc(text) + '</span></div>' : '';
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        show('');
        if (!sid.value.trim() || !pw.value) return show('Enter your Student ID and password.');
        if (!navigator.onLine) return show('You need internet to sign in. If you already started a test on this device, open it from your dashboard.');
        go.disabled = true;
        go.innerHTML = '<span class="spin"></span> Signing in…';
        try {
          await DBI.studentSignIn(sid.value, pw.value, document.getElementById('shared').checked);
          go.innerHTML = DBI.icon('check') + ' Welcome!';
          location.replace(safeNext);
        } catch (err) {
          show(err.message || 'Sign in failed. Please try again.');
          go.disabled = false;
          go.textContent = 'Sign in';
          pw.select();
        }
      });

      // Already signed in: go straight to the dashboard (checked after the form is ready).
      var user = await DBI.currentUser();
      if (user && (await DBI.claims(user)).role === 'student') location.replace(safeNext);
    })();
  </script>
</body>
</html>
