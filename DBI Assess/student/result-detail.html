<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Result — DBI Assess</title>
  <meta name="theme-color" content="#03c14b">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../images/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="../shared/exam.css">
  <style>
    .rv { border-left: 5px solid #d0d5dd; }
    .rv.correct { border-left-color: var(--green); } .rv.partial { border-left-color: #f79009; } .rv.incorrect, .rv.unanswered { border-left-color: var(--red); } .rv.pending { border-left-color: var(--blue); }
    .ans { background: #f9fafb; border-radius: 10px; padding: 10px 12px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
  <main class="page"><a href="results.html" class="btn ghost sm" style="margin-bottom:12px" id="back"></a><div id="out"><div class="card skeleton" style="height:180px"></div></div></main>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/core.js"></script>
  <script>
    (async function () {
      var me = await DBI.requireStudent();
      DBI.studentShell('results', me);
      var esc = DBI.esc, icon = DBI.icon, rich = DBI.rich;
      document.getElementById('back').innerHTML = icon('left') + 'My results';
      var out = document.getElementById('out');
      var id = new URLSearchParams(location.search).get('id');

      function textOf(list, id) {
        var o = (list || []).filter(function (x) { return x.id === id; })[0];
        return o ? o.text : id;
      }
      /** Shows the student's answer in words, whatever the question type. */
      function answerText(q, a) {
        if (a === null || a === undefined || a === '' || (Array.isArray(a) && !a.length)) return '<i class="muted">No answer</i>';
        switch (q.type) {
          case 'multiple-choice': return rich(textOf(q.options, a));
          case 'multiple-select': return (Array.isArray(a) ? a : [a]).map(function (x) { return rich(textOf(q.options, x)); }).join('<br>');
          case 'matching': return (q.prompts || []).map(function (p) { return esc(p.text) + ' → ' + esc(a[p.id] ? textOf(q.choices, a[p.id]) : '—'); }).join('<br>');
          case 'ordering': return (Array.isArray(a) ? a : []).map(function (x, i) { return (i + 1) + '. ' + esc(textOf(q.items, x)); }).join('<br>');
          case 'fill-blank': return (Array.isArray(a) ? a : [a]).map(function (x, i) { return (q.blanks > 1 ? 'Blank ' + (i + 1) + ': ' : '') + esc(x || '—'); }).join('<br>');
          case 'file-upload': return a.url ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.name || 'Uploaded file') + '</a>' : '<i class="muted">No file</i>';
          case 'code': return '<pre class="code" style="margin:0"><code>' + esc(a) + '</code></pre>';
          default: return esc(a);
        }
      }
      var LABEL = { correct: ['green', 'Correct'], partial: ['amber', 'Partly correct'], incorrect: ['red', 'Incorrect'], unanswered: ['red', 'Not answered'], pending: ['blue', 'Being marked'] };

      try {
        var r = await DBI.api('GET', '/me/attempts/' + encodeURIComponent(id), null, { retries: 1 });
        if (r.legacy) {
          out.innerHTML = '<div class="card"><h1>' + esc(r.assessmentTitle || 'Result') + '</h1><p class="muted">This result was recorded by the old system.</p><p>Score: <b>' + esc(r.score ?? '—') + '%</b></p></div>';
          return;
        }
        var head = '<div class="card" style="text-align:center"><span class="badge blue">Attempt ' + esc(r.attemptNumber) + '</span><h1 style="margin-top:8px">' + esc(r.assessmentTitle) + '</h1><p class="muted">Submitted ' + esc(DBI.fmtDate(r.submittedAt, true)) + (r.timeTaken ? ' · took ' + esc(DBI.fmtDuration(r.timeTaken)) : '') + '</p>';
        if (!r.released) {
          out.innerHTML = head + icon('clock', 'big-ic') + '<h2>' + (r.gradingStatus === 'pending-review' ? 'Your teacher is marking your answers' : 'Results not released yet') + '</h2><p class="muted">Check again later. You will see your score and answers here.</p></div>';
          return;
        }
        var html = head;
        if (typeof r.score === 'number') {
          html += '<div class="score-ring" style="--p:' + r.score + '"><div>' + r.score + '%</div></div><p>' + (r.passed ? '<span class="badge green">Passed</span>' : '<span class="badge red">Not passed yet</span>') + ' <span class="muted small">' + esc(r.earnedPoints) + ' / ' + esc(r.totalPoints) + ' marks · pass mark ' + esc(r.passingScore) + '%</span></p>';
          if (r.counts) html += '<div class="row small" style="justify-content:center">' + ['correct', 'partial', 'incorrect', 'unanswered'].map(function (k) { return r.counts[k] ? '<span class="badge ' + LABEL[k][0] + '">' + r.counts[k] + ' ' + LABEL[k][1].toLowerCase() + '</span>' : ''; }).join(' ') + '</div>';
        }
        if (r.certificateId) html += '<p class="alert ok" style="margin-top:12px;justify-content:center">' + icon('award') + '<span>Certificate earned: <a href="student-certificates.html">' + esc(r.certificateId) + '</a></span></p>';
        html += '</div>';
        (r.review || []).forEach(function (row, i) {
          var q = row.question;
          var l = LABEL[row.status] || ['', row.status];
          html += '<section class="card rv ' + esc(row.status) + '"><div class="row"><b class="qnum">Question ' + (i + 1) + '</b><span class="badge ' + l[0] + '">' + l[1] + '</span><span class="spacer"></span>' + (row.max !== undefined ? '<b class="small">' + esc(Math.max(0, row.score || 0)) + ' / ' + esc(row.max) + '</b>' : '') + '</div>' +
            '<div class="qtext" style="margin:10px 0">' + rich(q.text) + '</div>' + (q.imageUrl ? '<img class="qimg" src="' + esc(q.imageUrl) + '" alt="">' : '') +
            '<div class="lbl">Your answer</div><div class="ans">' + answerText(q, row.answer) + '</div>' +
            (row.correct && row.correct.text && row.status !== 'correct' ? '<div class="lbl" style="margin-top:8px">Correct answer</div><div class="ans" style="background:var(--green-50)">' + rich(row.correct.text) + '</div>' : '') +
            (row.explanation ? '<div class="alert" style="margin-top:8px">' + icon('help') + '<div>' + rich(row.explanation) + '</div></div>' : '') +
            (row.comment ? '<div class="alert ok" style="margin-top:8px">' + icon('user') + '<div><b>Teacher’s comment:</b> ' + rich(row.comment) + '</div></div>' : '') + '</section>';
        });
        out.innerHTML = html;
      } catch (e) {
        out.innerHTML = '<div class="card empty">' + icon(e.offline ? 'wifiOff' : 'alert') + '<p>' + esc(e.offline ? 'Connect to the internet to see this result.' : e.message) + '</p></div>';
      }
    })();
  </script>
</body>
</html>
