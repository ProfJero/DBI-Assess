<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Results - DBI Assess Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        sidebar: '#1a1f2c',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        info: '#06b6d4',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    boxShadow: {
                        'soft': '0 2px 15px -3px rgba(0,0,0,0.07), 0 10px 20px -2px rgba(0,0,0,0.04)',
                        'strong': '0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04)',
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        /* ============================================================
           DBI ASSESS ADMIN - RESULTS STYLES
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: #1a1f2c;
            color: white;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            padding-bottom: 20px;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 2px;
        }

        .sidebar-brand {
            padding: 20px 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            background: #1a1f2c;
            z-index: 2;
        }

        .sidebar-brand .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #166534, #22c55e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .sidebar-brand .brand-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }
        .sidebar-brand .brand-text span {
            color: #22c55e;
        }
        .sidebar-brand .brand-sub {
            font-size: 9px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 1px;
        }

        .sidebar-menu {
            padding: 12px 10px;
        }

        .sidebar-menu .menu-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #6b7280;
            letter-spacing: 1.2px;
            padding: 12px 12px 6px;
            font-weight: 600;
        }

        .sidebar-menu .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #9ca3af;
            transition: all 0.25s ease;
            cursor: pointer;
            margin-bottom: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .sidebar-menu .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }

        .sidebar-menu .menu-item.active {
            background: linear-gradient(135deg, #166534, #15803d);
            color: white;
            box-shadow: 0 4px 15px rgba(22, 101, 52, 0.3);
        }

        .sidebar-menu .menu-item i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-menu .menu-item .badge {
            margin-left: auto;
            background: #dc2626;
            color: white;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .sidebar-menu .menu-item .badge.green {
            background: #22c55e;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP HEADER ===== */
        .top-header {
            background: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: 64px;
            flex-shrink: 0;
        }

        .top-header .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .top-header .header-left .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            color: #1a1f2c;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
        }

        .top-header .header-left .page-title h1 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1f2c;
        }

        .top-header .header-left .page-title p {
            font-size: 12px;
            color: #6b7280;
        }

        .top-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .top-header .header-right .admin-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            transition: background 0.2s ease;
        }

        .top-header .header-right .admin-profile:hover {
            background: #f3f4f6;
        }

        .top-header .header-right .admin-profile .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #166534, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }

        .top-header .header-right .admin-profile .admin-info .name {
            font-weight: 600;
            color: #1a1f2c;
            font-size: 13px;
        }

        .top-header .header-right .admin-profile .admin-info .role {
            color: #6b7280;
            font-size: 11px;
        }

        /* ===== CONTENT AREA ===== */
        .content-area {
            padding: 20px 24px 40px;
            flex: 1;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1f2c;
            margin: 0;
        }
        .page-header .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-top: 4px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .stat-card .stat-icon.blue { background: #dbeafe; color: #1d4ed8; }
        .stat-card .stat-icon.green { background: #dcfce7; color: #166534; }
        .stat-card .stat-icon.orange { background: #fef3c7; color: #d97706; }
        .stat-card .stat-icon.purple { background: #ede9fe; color: #7c3aed; }
        .stat-card .stat-icon.red { background: #fee2e2; color: #dc2626; }
        .stat-card .stat-number {
            font-size: 22px;
            font-weight: 700;
            color: #1a1f2c;
            line-height: 1.2;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: #6b7280;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: white;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            align-items: center;
        }
        .filter-group {
            flex: 1;
            min-width: 120px;
            position: relative;
        }
        .filter-group.search-group {
            flex: 2;
            min-width: 180px;
        }
        .filter-group.search-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
        }
        .filter-group.search-group input {
            padding-left: 36px;
        }
        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            transition: all 0.3s ease;
        }
        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #22c55e;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        /* ===== TABLE ===== */
        .table-container {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        .table-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-header span {
            font-weight: 600;
            font-size: 14px;
            color: #1a1f2c;
        }
        .table-header .table-count {
            font-weight: 400;
            color: #6b7280;
            font-size: 13px;
        }
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        table th {
            background: #f8fafc;
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }
        table td {
            padding: 12px 16px;
            font-size: 13px;
            color: #1a1f2c;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }
        table tr:last-child td {
            border-bottom: none;
        }
        table tr:hover td {
            background: #fafafa;
        }

        /* Badges */
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-status.passed { background: #dcfce7; color: #166534; }
        .badge-status.failed { background: #fee2e2; color: #991b1b; }
        .badge-status.pending { background: #fef3c7; color: #92400e; }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .action-btns button {
            background: none;
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            color: #6b7280;
            font-family: 'Inter', sans-serif;
        }
        .action-btns button:hover {
            background: #f3f4f6;
            color: #1a1f2c;
        }
        .action-btns button.view:hover {
            color: #1d4ed8;
            background: #dbeafe;
        }
        .action-btns button.delete:hover {
            color: #dc2626;
            background: #fee2e2;
        }
        .action-btns button.export:hover {
            color: #166534;
            background: #dcfce7;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #6b7280;
        }
        .empty-state i {
            font-size: 40px;
            color: #d1d5db;
            margin-bottom: 14px;
            display: block;
        }
        .empty-state h3 {
            font-size: 17px;
            color: #1a1f2c;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a1f2c;
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90%;
        }
        .toast.show {
            transform: translateY(0);
        }
        .toast i {
            font-size: 18px;
        }
        .toast.success { background: #166534; }
        .toast.error { background: #dc2626; }

        /* Sidebar overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #166534, #22c55e);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(22, 101, 52, 0.3);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #1a1f2c;
            border: 1px solid #e5e7eb;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 18px;
            max-width: 700px;
            width: 100%;
            max-height: 92vh;
            overflow: hidden;
            animation: modalSlideUp 0.3s ease;
        }
        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            border-radius: 18px 18px 0 0;
            z-index: 2;
        }
        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1f2c;
        }
        .modal-header .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .modal-header .close-modal:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .modal-body {
            padding: 0 !important;
            max-height: calc(92vh - 150px);
            overflow-y: auto;
        }
        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .modal-body-inner {
            padding: 22px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .modal {
                max-width: 95%;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 0 0 40px rgba(0,0,0,0.3);
            }
            .sidebar-overlay.show {
                display: block;
            }
            .main-content {
                margin-left: 0;
            }
            .top-header {
                padding: 10px 16px;
                min-height: 56px;
            }
            .top-header .header-left .hamburger {
                display: block;
            }
            .top-header .header-left .page-title h1 {
                font-size: 16px;
            }
            .top-header .header-left .page-title p {
                font-size: 11px;
            }
            .top-header .header-right .admin-profile .admin-info {
                display: none;
            }
            .content-area {
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .stat-card {
                padding: 14px 16px;
            }
            .stat-card .stat-number {
                font-size: 20px;
            }
            .filter-bar {
                flex-direction: column;
            }
            .filter-group {
                min-width: 100%;
            }
            table {
                min-width: 600px;
                font-size: 12px;
            }
            table th, table td {
                padding: 10px 12px;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .page-header .header-actions {
                width: 100%;
            }
            .page-header .header-actions .btn-primary {
                flex: 1;
                justify-content: center;
            }
            .modal {
                max-width: 100%;
                margin: 10px;
                border-radius: 14px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card {
                padding: 12px;
                gap: 10px;
            }
            .stat-card .stat-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .stat-card .stat-number {
                font-size: 17px;
            }
            .stat-card .stat-label {
                font-size: 11px;
            }
            table {
                font-size: 11px;
                min-width: 500px;
            }
            table th, table td {
                padding: 8px 10px;
            }
            .badge-status {
                font-size: 10px;
                padding: 3px 10px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c7cd;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a8b0;
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div>
                <div class="brand-text">DBI <span>Assess</span></div>

    <script src="js/results.js"></script>
    
    <script>
        // ============================================================
        // FIREBASE CONFIGURATION
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyCdrmMMmZ0xdC2A_GXdAcWnUAa1i6QbjwQ",
            authDomain: "dbi-assess.firebaseapp.com",
            projectId: "dbi-assess",
            storageBucket: "dbi-assess.firebasestorage.app",
            messagingSenderId: "558455201415",
            appId: "1:558455201415:web:4a12a7b7c4cff9ecb6a222",
            measurementId: "G-FE2BPSJ4C5"
        };

        let db = null;
        let currentUser = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log('✅ Firebase initialized successfully');
        } catch (error) {
            console.error('❌ Firebase initialization error:', error);
        }

        // ============================================================
        // AUTHENTICATION CHECK
        // ============================================================

        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                console.log('✅ User logged in:', user.email || user.uid);
                
                try {
                    const adminDoc = await db.collection('admins').doc(user.uid).get();
                    if (adminDoc.exists) {
                        const adminData = adminDoc.data();
                        document.getElementById('adminName').textContent = adminData.name || user.email;
                        document.getElementById('adminRole').textContent = adminData.role || 'Super Admin';
                        document.getElementById('adminAvatar').textContent = (adminData.name || 'A').charAt(0).toUpperCase();
                        
                        // Initialize Results module
                        const container = document.getElementById('pageContent');
                        if (typeof Results !== 'undefined') {
                            Results.render(container, { db: db });
                        }
                    } else {
                        showToast('You are not an admin', true);
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                    }
                } catch (error) {
                    console.error('Admin check error:', error);
                    showToast('Error verifying admin status', true);
                }
            } else {
                console.log('⚠️ No user logged in');
                // window.location.href = 'index.html';
            }
        });

        // ============================================================
        // GLOBAL FUNCTIONS
        // ============================================================

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            if (overlay) overlay.classList.remove('show');
            document.body.style.overflow = '';
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.className = 'toast';
            if (isError) {
                toast.classList.add('error');
                toast.querySelector('i').className = 'fas fa-exclamation-circle';
            } else {
                toast.classList.add('success');
                toast.querySelector('i').className = 'fas fa-check-circle';
            }
            toast.classList.add('show');
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                firebase.auth().signOut().then(() => {
                    window.location.href = 'index.html';
                }).catch(error => {
                    showToast('Error logging out: ' + error.message, true);
                });
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            // Hamburger menu
            document.getElementById('hamburgerBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebarOverlay').classList.toggle('show');
            });

            // Close sidebar on overlay click
            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

            // Close sidebar on window resize (desktop)
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('show');
                }
            });

            // Escape key to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });

        console.log('%c📊 DBI Assess Admin Panel', 'font-size: 20px; font-weight: bold; color: #166534;');
        console.log('%c🔐 Results Management System v1.0', 'font-size: 14px; color: #22c55e;');
        console.log('%c📚 View and analyze student performance', 'font-size: 14px; color: #6b7280;');
    </script>
